      })(), function () { return window.__rivalPull; }());

    /* ============ A PLANNED RELEASE ACTUALLY GOES OUT ================ */
    h('A release you planned is a release that ships');

    /* Everything else about the roadmap is decoration if the patch
       never leaves the building. This broke because the weekly ship
       check asked "how funded is this game" without naming the
       release, and the answer it got came from a pool that a live
       game stopped filling the moment releases started banking their
       own work. Every release read as 0% built: the dated ones were
       pushed back four weeks, every week, for ever, and "ship as soon
       as it is finished" never fired at all.

       So these run on a MATURE game with an empty studio pool, which
       is the only shape that shows it. A young studio sitting on
       banked capacity papers straight over it.                      */

    function matureGame(seed) {
      var d = PN.presets.build('themepark');
      for (var i = 0; i < 5; i++) {
        PN.expansions.addDungeon(d, { raid: i % 2 === 1, rng: new U.Rng(70 + i),
          level: d.progression.levelCap, name: 'Wing ' + i });
      }
      U.bumpDesign(d);
      var s = PN.state.newGame({ design: d, seed: seed || 31 });
      s.phase = 'live'; s.shipped = U.clone(d); s.week = 300;
      s.version = { major: 4, minor: 2, patch: 0 };
      s.patchPlan = []; s.released = [];
      /* The studio banks nothing. Years in, that is normal. */
      s.progress = { design: 0, art: 0, eng: 0, qa: 0 };
      PN.pop.ensureCohorts(s); PN.economy.init(s); PN.competitors.init(s);
      s.scenario = { id: 'sandbox', free: true };
      return s;
    }
    function fundTo(state, plan, share) {
      var bill = PN.patches.planCost(state, plan);
      var bank = PN.patches.progressOf(state, plan);
      ['design', 'art', 'eng', 'qa'].forEach(function (k) { bank[k] = bill[k] * share; });
    }

    check('a release the player planned goes out on its date', (function () {
      var s = matureGame(31);
      var plan = PN.patches.newPlan({ kind: 'minor', targetWeek: s.week + 8 });
      s.patchPlan.push(plan);
      author(s, plan, function (d) {
        PN.expansions.addDungeon(d, { raid: false, rng: new U.Rng(9),
          level: d.progression.levelCap, name: 'The New Wing' });
      });
      /* Part built, which is the normal state of a release on its
         date - the game ships what was finished and says so. */
      fundTo(s, plan, 0.62);
      var due = plan.targetWeek, shipped = null, slips = [];
      for (var i = 0; i < 20 && shipped === null; i++) {
        PN.sim.advance(s);
        if (plan.status === 'shipped') shipped = s.week;
        else if (plan.targetWeek !== due &&
                 slips[slips.length - 1] !== plan.targetWeek) slips.push(plan.targetWeek);
      }
      window.__shipsOnDate = shipped !== null
        ? 'shipped in week ' + shipped + ', due ' + due
        : 'NEVER shipped; it is week ' + s.week + ' and the date has moved to ' +
          plan.targetWeek + (slips.length ? ' (' + slips.join(' then ') + ')' : '');
      return shipped !== null && shipped <= due + 1 && slips.length === 0;
    })(), function () { return window.__shipsOnDate; }());

    check('and "ship as soon as it is finished" fires when it is finished',
      (function () {
        var s = matureGame(32);
        var plan = PN.patches.newPlan({ kind: 'minor', targetWeek: s.week + 50,
                                        shipWhenReady: true });
        s.patchPlan.push(plan);
        author(s, plan, function (d) {
          PN.expansions.addDungeon(d, { raid: false, rng: new U.Rng(11),
            level: d.progression.levelCap, name: 'The Early Wing' });
        });
        fundTo(s, plan, 1.05);
        var shipped = null;
        for (var i = 0; i < 20 && shipped === null; i++) {
          PN.sim.advance(s);
          if (plan.status === 'shipped') shipped = s.week;
        }
        window.__shipsEarly = shipped !== null
          ? 'shipped in week ' + shipped + ', forty-nine weeks before its date'
          : 'NEVER shipped, at ' + Math.round(PN.patches.funded(s, plan) * 100) + '% built';
        return shipped !== null && shipped < s.week + 40;
      })(), function () { return window.__shipsEarly; }());

    check('a roadmap of three ships all three, in order', (function () {
      var s = matureGame(33);
      var made = [];
      for (var i = 0; i < 3; i++) {
        var pl = PN.patches.newPlan({ kind: 'patch', targetWeek: s.week + 4 + i * 5 });
        s.patchPlan.push(pl); made.push(pl);
        author(s, pl, function (d) { d.stats.critBonus += 3; });
      }
      made.forEach(function (pl) { fundTo(s, pl, 1.05); });
      for (var wk = 0; wk < 30; wk++) PN.sim.advance(s);
      var out = made.filter(function (p) { return p.status === 'shipped'; });
      window.__three = out.length + ' of 3 shipped, in weeks ' +
        made.map(function (p) { return p.shippedWeek || '—'; }).join(', ');
      return out.length === 3 &&
             made[0].shippedWeek <= made[1].shippedWeek &&
             made[1].shippedWeek <= made[2].shippedWeek;
    })(), function () { return window.__three; }());

    check('and asking how built a live game is means the release being built',
      (function () {
        /* The trap that caused all of the above: a helper that answers
           a different question when you forget to name the release. */
        var s = matureGame(34);
        var plan = PN.patches.newPlan({ kind: 'minor', targetWeek: s.week + 8 });
        s.patchPlan.push(plan);
        author(s, plan, function (d) { d.stats.critBonus += 5; });
        fundTo(s, plan, 0.5);
        var named = PN.patches.funded(s, plan);
        var unnamed = PN.patches.funded(s);
        window.__sameAnswer = 'naming the release gives ' + Math.round(named * 100) +
          '%, not naming it gives ' + Math.round(unnamed * 100) + '%';
        return Math.abs(named - unnamed) < 0.01 && named > 0.4;
      })(), function () { return window.__sameAnswer; }());

    /* =============== A MARKET YOU CAN MAKE A DENT IN ================== */
    h('A market with a number you can move');

    check('the market the screen shows is the market the game acquires from',
      (function () {
        /* The Market screen printed the real genre's forty-four million
           beside a playerbase counted in the scaled-down world the sim
           actually runs. Same factor of a hundred behind both halves of
           "the market is enormous" and "penetration is 0.1%". */
        var era = PN.tax.eraForYear(2016);
        var shown = PN.tax.marketPool(era);
        var used = shown;      /* population.js reads the same function */
        window.__oneMarket = 'the screen says ' + U.fmtCompact(shown) +
          ' and the simulation acquires out of ' + U.fmtCompact(used);
        return shown === used && shown < 1e6;
      })(), function () { return window.__oneMarket; }());

    check('and a live game reads as a real share of it', (function () {
      var era = PN.tax.eraForYear(2016);
      var pool = PN.tax.marketPool(era);
      var typical = 20000;
      window.__pen = 'a twenty-thousand-player game is ' +
        U.fmtPct(typical / pool * 100, 1) + ' of ' + U.fmtCompact(pool);
      return typical / pool > 0.03 && typical / pool < 0.75;
    })(), function () { return window.__pen; }());

    check('and shrinking the WORLD leaves the same people in the game',
      (function () {
        /* MARKET_SCALE decides how far the genre is shrunk so every
           player can be simulated as a person. It is a dial about what
           the screen reads: intake and saturation are both measured
           against the size of the pool, so the scale divides straight
           back out of both. Turn it and the Market screen changes and
           the game does not - and if that ever stops being true, this
           is what says so. */
        var d = PN.presets.build('themepark');
        var s = PN.state.newGame({ design: d, seed: 41 });
        var ax = PN.sim.currentAxes(s);
        var fit = PN.axes.archetypeFit(d, ax);
        s.population.lifetimeAccounts = 30000;
        var was = PN.tax.MARKET_SCALE;
        var poolA = PN.tax.marketPool(s.era);
        var a = PN.pop.acquire(s, fit, ax._ctx.coherence).total;
        PN.tax.MARKET_SCALE = was * 3;
        var poolB = PN.tax.marketPool(s.era);
        var b = PN.pop.acquire(s, fit, ax._ctx.coherence).total;
        PN.tax.MARKET_SCALE = was;
        window.__scaleNeutral = 'a world of ' + U.fmtCompact(poolA) + ' and a world of ' +
          U.fmtCompact(poolB) + ' both take in ' + U.round(a, 2) + ' and ' +
          U.round(b, 2) + ' players a week';
        return poolB < poolA && Math.abs(b - a) < a * 0.02;
      })(), function () { return window.__scaleNeutral; }());

    /* ========== THE ROSTER IS A SAMPLE OF THE PLAYERS ================ */
    h('A roster is a sample, and a sample has to be OF something');

    /* The game simulates three and a half thousand players and calls
       them a population of sixty thousand, so each row on the roster
       stands for a crowd. Everything below is about that lie staying
       honest: the crowd has to be made of the same people as the
       population, and it has to behave like a crowd rather than like
       one very heavy person. */

    function rosterGame(seed) {
      var d = PN.presets.build('themepark');
      var s = PN.state.newGame({ design: d, seed: seed || 5 });
      s.phase = 'live'; s.shipped = U.clone(d); s.week = 40;
      PN.pop.ensureCohorts(s); PN.economy.init(s);
      return s;
    }
    function archShares(st) {
      var out = {}, tot = U.sum(st.agents, function (a) { return a.w; }) || 1;
      PN.tax.ARCHETYPES.forEach(function (a) { out[a.id] = 0; });
      st.agents.forEach(function (a) { out[a.a] += a.w; });
      PN.tax.ARCHETYPES.forEach(function (a) { out[a.id] = out[a.id] / tot * 100; });
      return out;
    }

    check('compacting the roster does not change WHO is playing', (function () {
      /* Admit the exact market mix, let them level at the speeds their
         archetypes actually play at, and compact - nothing else. The
         old sampler stratified by level and ranked by tenure, then
         scaled every survivor up by one number to put the missing
         population back. A raider is at the cap in a month and a
         drifter may never get there, so the drifters were the rows
         dropped every single week and their players were handed to the
         raiders who stayed. Twelve percent raiders became fifty-four,
         and the drifters - the biggest slice of the real market - went
         to nothing, with no design decision anywhere behind it. */
      var s = rosterGame(5);
      var rng = new U.Rng(5);
      var ctx = { rng: rng, world: PN.agents.buildWorldCache(s) };
      var mix = PN.tax.marketMix(s.era);
      PN.tax.ARCHETYPES.forEach(function (a) {
        PN.agents.admit(s, a.id, 12000 * mix[a.id], ctx); });
      var before = archShares(s);
      for (var r = 0; r < 30; r++) {
        s.agents.forEach(function (a) {
          var arch = PN.tax.ARCHETYPE_BY_ID[a.a];
          a.lv = Math.min(s.design.progression.levelCap, (a.lv || 1) + arch.time / 9);
          a.t = (a.t || 0) + 1;
        });
        PN.tax.ARCHETYPES.forEach(function (a) {
          PN.agents.admit(s, a.id, 700 * mix[a.id], ctx); });
        PN.agents.compact(s, rng);
      }
      var after = archShares(s);
      var worst = null;
      PN.tax.ARCHETYPES.forEach(function (a) {
        var drift = Math.abs(after[a.id] - before[a.id]);
        if (!worst || drift > worst.drift) worst = { name: a.name, drift: drift,
          from: before[a.id], to: after[a.id] };
      });
      window.__mixHeld = 'after thirty compactions the biggest move is ' + worst.name +
        ': ' + worst.from.toFixed(1) + '% to ' + worst.to.toFixed(1) + '%';
      return worst.drift < 1.5;
    })(), function () { return window.__mixHeld; }());

    check('and it keeps every player it had', (function () {
      var s = rosterGame(6);
      var rng = new U.Rng(6);
      var ctx = { rng: rng, world: PN.agents.buildWorldCache(s) };
      PN.tax.ARCHETYPES.forEach(function (a) { PN.agents.admit(s, a.id, 900, ctx); });
      var before = U.sum(s.agents, function (a) { return a.w; });
      var dropped = PN.agents.compact(s, rng);
      var after = U.sum(s.agents, function (a) { return a.w; });
      window.__popHeld = U.fmtInt(before) + ' players on ' + (s.agents.length + dropped) +
        ' rows became ' + U.fmtInt(after) + ' on ' + s.agents.length;
      return Math.abs(after - before) < 1 && dropped > 0;
    })(), function () { return window.__popHeld; }());

    check('and no one row ends up carrying a whole zone', (function () {
      /* A three-year save had a single row standing for seventeen
         thousand players - a third of the game riding on one row's
         luck, and a Players screen showing one name where a city
         should be. Rows inside a level band are interchangeable, so
         the people in that band are shared out between them. */
      var s = rosterGame(7);
      var rng = new U.Rng(7);
      var ctx = { rng: rng, world: PN.agents.buildWorldCache(s) };
      var mix = PN.tax.marketMix(s.era);
      PN.tax.ARCHETYPES.forEach(function (a) {
        PN.agents.admit(s, a.id, 40000 * mix[a.id], ctx); });
      for (var r = 0; r < 12; r++) {
        s.agents.forEach(function (a) { a.t = (a.t || 0) + 1; });
        PN.tax.ARCHETYPES.forEach(function (a) {
          PN.agents.admit(s, a.id, 2000 * mix[a.id], ctx); });
        PN.agents.compact(s, rng);
      }
      var tot = U.sum(s.agents, function (a) { return a.w; });
      var top = 0;
      s.agents.forEach(function (a) { top = Math.max(top, a.w); });
      window.__noGiants = 'the heaviest row stands for ' + Math.round(top) + ' of ' +
        U.fmtInt(tot) + ' players (' + (top / tot * 100).toFixed(2) + '%)';
      return top / tot < 0.01;
    })(), function () { return window.__noGiants; }());

    check('a crowd churns at its rate rather than on one coin', (function () {
      /* This is the bug behind a playerbase going from sixty thousand
         to fourteen thousand between one Tuesday and the next with
         satisfaction steady the whole way: one unlucky roll took
         everybody a heavy row stood for, all at once. */
      var s = rosterGame(8);
      var rng = new U.Rng(8);
      var ctx0 = { rng: rng, world: PN.agents.buildWorldCache(s) };
      PN.tax.ARCHETYPES.forEach(function (a) { PN.agents.admit(s, a.id, 300, ctx0); });
      /* One row per two hundred players, which is what a big game
         looks like on a bounded roster. */
      s.agents.forEach(function (a) { a.w = 200; a.sat = 62; a.t = 30; });
      s.population.total = U.sum(s.agents, function (a) { return a.w; });
      var ax = PN.sim.currentAxes(s);
      var world = PN.agents.buildWorldCache(s);
      var start = s.population.total, worst = 0;
      for (var wk = 0; wk < 8; wk++) {
        var was = U.sum(s.agents, function (a) { return a.w; });
        PN.agents.tickAll(s, { rng: rng, vals: PN.axes.values(ax),
          fit: PN.axes.archetypeFit(s.design, ax), balance: ax._ctx.balance,
          engines: ax._ctx.engines, lastChurnRate: 0, world: world,
          builds: world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
        var now = U.sum(s.agents, function (a) { return a.w; });
        worst = Math.max(worst, (was - now) / Math.max(1, was));
      }
      var end = U.sum(s.agents, function (a) { return a.w; });
      window.__smoothChurn = 'over eight weeks ' + U.fmtInt(start) + ' became ' +
        U.fmtInt(end) + ', and the worst single week lost ' +
        (worst * 100).toFixed(1) + '%';
      /* People do leave - the point is that it is a rate, not a cliff. */
      return end < start && worst < 0.2;
    })(), function () { return window.__smoothChurn; }());

    check('every audience converts somebody, however the game reads to them',
      (function () {
        /* A minority audience and an audience that does not exist are
           different things, and the second is one the player can never
           do anything about. Every real MMO has people in it who are
           not the people it was built for. */
        var s = rosterGame(9);
        var ax = PN.sim.currentAxes(s);
        var fit = PN.axes.archetypeFit(s.design, ax);
        var acq = PN.pop.acquire(s, fit, ax._ctx.coherence);
        var lo = null, hi = null;
        PN.tax.ARCHETYPES.forEach(function (a) {
          var n = acq.byArchetype[a.id] / PN.tax.marketMix(s.era)[a.id];
          if (lo === null || n < lo.n) lo = { a: a, n: n };
          if (hi === null || n > hi.n) hi = { a: a, n: n };
        });
        window.__floor = 'per head of their own market, ' + hi.a.name +
          ' convert ' + (hi.n / lo.n).toFixed(1) + ' times as well as ' + lo.a.name;
        return lo.n > 0 && hi.n / lo.n < 6;
      })(), function () { return window.__floor; }());

    check('an audience the game is not for still turns up, in proportion',
      (function () {
        /* Handed a design that is 90% right for raiders and 5% right
           for roleplayers, the steep conversion curve on its own would
           say the roleplayers simply never arrive - and an audience
           that can never be in the game is an audience the player can
           never do anything about. The floor is a share of what the
           best-served audience in the SAME game converts, so a
           minority audience is small rather than absent. */
        var st2 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 12 });
        var ax2 = PN.sim.currentAxes(st2);
        var lopsided = {};
        PN.tax.ARCHETYPES.forEach(function (a) { lopsided[a.id] = 5; });
        lopsided.raider = 90;
        var acq = PN.pop.acquire(st2, lopsided, ax2._ctx.coherence);
        var mix2 = PN.tax.marketMix(st2.era);
        var best = acq.byArchetype.raider / mix2.raider;
        var worst = acq.byArchetype.roleplayer / mix2.roleplayer;
        window.__floorWorks = 'a design 90% right for raiders and 5% right for ' +
          'roleplayers still takes roleplayers at ' +
          U.fmtPct(worst / best * 100, 0) + ' of the rate it takes raiders';
        return worst > 0 && worst / best > 0.19 && worst / best < 0.25;
      })(), function () { return window.__floorWorks; }());

    check('and the floor rises and falls with the game, so it is not a subsidy',
      (function () {
        /* A FLAT floor would have paid a game with nothing in it
           exactly what it paid a good one, and what you build would
           have stopped deciding how many people you hold. */
        function worstOf(fitLevel) {
          var st2 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 12 });
          var ax2 = PN.sim.currentAxes(st2);
          var f = {};
          PN.tax.ARCHETYPES.forEach(function (a) { f[a.id] = 5; });
          f.raider = fitLevel;
          var acq = PN.pop.acquire(st2, f, ax2._ctx.coherence);
          return acq.byArchetype.roleplayer;
        }
        var good = worstOf(90), bad = worstOf(35);
        window.__notSubsidy = 'the same neglected audience turns up ' +
          (good / Math.max(1e-9, bad)).toFixed(1) +
          ' times as often for a game that is good for somebody';
        return good > bad * 3;
      })(), function () { return window.__notSubsidy; }());

    check('and no audience is capped by an axis nobody measures', (function () {
      /* Novelty and stability are left out of fit because neither is
         knowable before a game is live. The weights were not
         renormalised afterwards, so an explorer - who puts 36% of
         their attention on those two - was scored out of 64 whatever
         anybody built, and a competitor out of 86. The audiences that
         cared most about what could not be measured were the ones the
         game could never satisfy. */
      var d = PN.presets.build('themepark');
      var s = PN.state.newGame({ design: d, seed: 11 });
      var fit = PN.axes.archetypeFit(d, PN.sim.currentAxes(s));
      var byWeight = PN.tax.ARCHETYPES.slice().sort(function (a, b) {
        return (b.weights.novelty + b.weights.stability) -
               (a.weights.novelty + a.weights.stability); });
      var most = byWeight[0], least = byWeight[byWeight.length - 1];
      window.__noCap = most.name + ' puts ' +
        Math.round((most.weights.novelty + most.weights.stability) * 100) +
        '% on the two unmeasured axes and reads ' + Math.round(fit[most.id]) +
        '; ' + least.name + ' puts ' +
        Math.round((least.weights.novelty + least.weights.stability) * 100) +
        '% and reads ' + Math.round(fit[least.id]);
      /* Not "equal" - just not decided by the arithmetic. */
      return fit[most.id] > 100 * (1 - most.weights.novelty - most.weights.stability);
    })(), function () { return window.__noCap; }());

    check('a bag recipe is not a dead end for losing money', (function () {
      /* Nothing consumes a bag and a vendor pays less for one than the
         leather costs, which is true of every bag in every MMO ever

    h('A sequel inherits an audience, and takes it from you');

    })(), function () { return window.__rivalPhen; }());

    check('nobody good enough means no phenomenon', (function () {
      var s0 = rivalWorld(93);
      s0.competitors = [probeRival('c1', 'Fine', 74)];
      var got = PN.competitors.makePhenomenon(s0, new U.Rng(6));
      var def = null;
      PN.events.EVENTS.forEach(function (d) { if (d.id === 'rivalPhenomenon') def = d; });
      var w = def ? def.when(s0, {}) : -1;
      window.__rivalPhenGate = 'the best rival is 74: makePhenomenon returned ' +
        (got ? got.name : 'nothing') + ', and the event weights it at ' + w;
      return !got && w === 0;
    })(), function () { return window.__rivalPhenGate; }());

    check('the phenomenon event is a once-per-save event', (function () {
      var def = null;
      PN.events.EVENTS.forEach(function (d) { if (d.id === 'rivalPhenomenon') def = d; });
      var s0 = rivalWorld(95);
      s0.competitors = [probeRival('c1', 'Great', 88)];
      var w = def ? def.when(s0, {}) : 0;
      s0.competitors[0].phenomenon = true;
      var after = def ? def.when(s0, {}) : -1;
      window.__rivalOnce = 'flagged once: ' + (def && def.once) + '; weight with an 88 about ' +
        U.round(w * 52 * 100, 1) + '% a year, and ' + after + ' once one exists';
      return !!def && def.once === true && w > 0 && after === 0;
    })(), function () { return window.__rivalOnce; }());

    check('a phenomenon is about a one-in-twenty year event', (function () {
      /* roll() picks ONE event a week out of a weighted pool, so a
         weight is a SHARE of that pool and not a probability - asking
         for five percent in the weight measured out at two and a half.
         So the number in the table is tuned, and what is asserted here
         is the rate it produces, which is the thing that was actually
         asked for. If the event table grows, this is what will notice. */
      var RUNS = 24, YEARS = 20, hits = 0, atRisk = 0;
      for (var run = 0; run < RUNS; run++) {
        var s0 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 5000 + run });
        s0.phase = 'live'; s0.shipped = U.clone(s0.design); s0.week = 1;
        s0.runtime.reviewScore = 74; s0.runtime.sentiment = 66;
        PN.pop.ensureCohorts(s0); PN.economy.init(s0);
        PN.competitors.init(s0);
        /* Somebody has to be good enough for it to be believable. */
        s0.competitors.forEach(function (c, i) { if (i === 0) c.quality = 84; });
        var rng = new U.Rng(run + 1), fired = false;
        for (var k = 0; k < YEARS * 52 && !fired; k++) {
          s0.week++;
          s0.pendingEvents = [];
          (PN.events.roll(s0, rng, { balance: null }) || []).forEach(function (e) {
            if (e.id === 'rivalPhenomenon') fired = true;
          });
          s0.log = s0.log.slice(0, 2);
          atRisk += 1 / 52;
        }
        if (fired) hits++;
      }
      var rate = atRisk > 0 ? hits / atRisk : 0;
      window.__phenRate = 'it happened in ' + hits + ' of ' + RUNS + ' saves, which is ' +
        U.fmtPct(rate * 100, 1) + ' a year against the 5% it is meant to be';
      /* A wide band on purpose: this is a sampled rate, not an identity. */
      return rate > 0.025 && rate < 0.085;
    })(), function () { return window.__phenRate; }());

    check('a rival reputation moves once or twice a year, not weekly', (function () {
      var RUNS = 8, YEARS = 15, moves = 0, atRisk = 0;
      for (var run = 0; run < RUNS; run++) {
        var s0 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 6000 + run });
        s0.phase = 'live'; s0.shipped = U.clone(s0.design); s0.week = 1;
        s0.runtime.reviewScore = 74; s0.runtime.sentiment = 66;
        PN.pop.ensureCohorts(s0); PN.economy.init(s0);
        PN.competitors.init(s0);
        var rng = new U.Rng(run + 1);
        for (var k = 0; k < YEARS * 52; k++) {
          s0.week++;
          s0.pendingEvents = [];
          (PN.events.roll(s0, rng, { balance: null }) || []).forEach(function (e) {
            if (e.id === 'rivalDrift') moves++;
          });
          s0.log = s0.log.slice(0, 2);
        }
        atRisk += YEARS;
      }
      var perYear = atRisk > 0 ? moves / atRisk : 0;
      window.__driftRate = 'a rival re-reviews ' + U.round(perYear, 2) +
        ' times a year across ' + RUNS + ' saves';
      return perYear > 0.5 && perYear < 4;
    })(), function () { return window.__driftRate; }());
    check('a phenomenon holds more of the market than its quality alone buys', (function () {
      var plain = rivalCeiling(rivalWorld(94), 86);
      var s1 = rivalWorld(94);
      var c = probeRival('cmp_probe', 'Probe', 86, { phenomenon: true, players: 1000, peak: 0 });
      s1.competitors = [c];
      PN.competitors.tick(s1, { rng: new U.Rng(1), world: { design: s1.design }, fit: {} });
      var famous = c.target || 0;
      window.__rivalPull = 'an 86-rated rival settles at ' + U.fmtInt(plain) +
        '; the same game as a phenomenon settles at ' + U.fmtInt(famous) +
        ' (x' + U.round(famous / Math.max(1, plain), 1) + ')';
      return famous > plain * 2;
    })(), function () { return window.__rivalPull; }());

    /* ============ RACES ============================================== */
    h('A race is a second question, and it is optional');

    /* A race hands out a handful of percentages and they land on the
       same profile fields a talent branch lands on - which is why the
       combat solver needed no changes at all to understand one.

       The part worth testing is the balance rule. Races multiply the
       combination count and most of the new combinations are bad on
       purpose, so putting all of them in the spread would make adding
       a fourth race read as a balance regression. Each build is
       measured at its BEST race instead. */

    function racedDesign(extra) {
      var d = PN.presets.build('themepark');
      d.races = [
        PN.races.newRace({ name: 'Human', bonuses: [{ kind: 'dmg', pct: 2 },
                                                    { kind: 'move', pct: 2 }] }),
        PN.races.newRace({ name: 'Dwarf', bonuses: [{ kind: 'dmgTaken', pct: -3 },
                                                    { kind: 'threat', pct: 8 }] }),
        PN.races.newRace({ name: 'Elf', bonuses: [{ kind: 'stat', statId: 'agi', pct: 5 },
                                                  { kind: 'move', pct: 3 }] }),
        PN.races.newRace({ name: 'Orc', bonuses: [{ kind: 'stat', statId: 'str', pct: 5 },
                                                  { kind: 'hp', pct: 3 }] })
      ];
      if (extra) extra(d);
      U.bumpDesign(d);
      return d;
    }

    check('a design with no races behaves exactly as it did before', (function () {
      var d = PN.presets.build('themepark');
      var on = PN.races.enabled(d);
      var evals = PN.combat.evaluateAll(d);
      var anyRaced = evals.list.filter(function (r) { return r.raceId; }).length;
      var best = PN.races.bestFor(d, PN.builds.enumerate(d)[0]);
      window.__raceOff = 'races enabled: ' + on + ', builds evaluated at a race: ' +
        anyRaced + ', best race for the first build: ' + (best ? best.name : 'none');
      return !on && anyRaced === 0 && best === null;
    })(), function () { return window.__raceOff; }());

    check('a race bonus actually reaches the combat solver', (function () {
      var d = PN.presets.build('themepark');
      var dpsB = PN.builds.enumerate(d).filter(function (b) {
        return b.buildRole === 'dps' && b.buildStat === 'str'; })[0];
      var tankB = PN.builds.enumerate(d).filter(function (b) {
        return b.buildRole === 'tank'; })[0];
      if (!dpsB || !tankB) { window.__raceSolver = 'no builds to test'; return false; }
      var orc = PN.races.newRace({ name: 'Orc',
        bonuses: [{ kind: 'stat', statId: 'str', pct: 10 }, { kind: 'dmg', pct: 5 }] });
      var dwarf = PN.races.newRace({ name: 'Dwarf',
        bonuses: [{ kind: 'dmgTaken', pct: -5 }, { kind: 'hp', pct: 8 }] });
      var d0 = PN.combat.evaluate(d, dpsB).dps;
      var d1 = PN.combat.evaluate(d, PN.races.applyTo(d, dpsB, orc)).dps;
      var t0 = PN.combat.evaluate(d, tankB).ehp;
      var t1 = PN.combat.evaluate(d, PN.races.applyTo(d, tankB, dwarf)).ehp;
      window.__raceSolver = 'Orc is worth ' + U.fmtPct((d1 / d0 - 1) * 100, 1) +
        ' damage to a Strength build; Dwarf is worth ' + U.fmtPct((t1 / t0 - 1) * 100, 1) +
        ' effective health to a tank';
      return d1 > d0 * 1.05 && t1 > t0 * 1.05;
    })(), function () { return window.__raceSolver; }());

    check('a stat race does nothing for a build that does not gear it', (function () {
      var d = PN.presets.build('themepark');
      var strB = PN.builds.enumerate(d).filter(function (b) { return b.buildStat === 'str'; })[0];
      var intB = PN.builds.enumerate(d).filter(function (b) { return b.buildStat === 'int'; })[0];
      if (!strB || !intB) { window.__raceMismatch = 'need two stat builds'; return false; }
      var orc = PN.races.newRace({ name: 'Orc',
        bonuses: [{ kind: 'stat', statId: 'str', pct: 8 }] });
      var forStr = PN.races.scoreFor(d, strB, orc);
      var forInt = PN.races.scoreFor(d, intB, orc);
      window.__raceMismatch = 'a Strength race is worth ' + U.round(forStr, 2) +
        ' to ' + strB.shortName + ' and ' + U.round(forInt, 2) + ' to ' + intB.shortName;
      return forStr > forInt * 1.5;
    })(), function () { return window.__raceMismatch; }());

    check('each build is measured at the race it would actually roll', (function () {
      var d = racedDesign();
      var evals = PN.combat.evaluateAll(d);
      var picked = {};
      evals.list.forEach(function (r) { if (r.raceName) picked[r.raceName] = true; });
      /* The tank should want the tough one and a Strength damage build
         should want the Strength one. That is the whole claim. */
      var tank = null, str = null;
      evals.list.forEach(function (r) {
        if (!tank && r.cls.buildRole === 'tank') tank = r;
        if (!str && r.cls.buildRole === 'dps' && r.cls.buildStat === 'str') str = r;
      });
      window.__racePick = 'the tank rolls ' + (tank ? tank.raceName : '?') +
        ', the Strength damage build rolls ' + (str ? str.raceName : '?') +
        '; ' + U.keys(picked).length + ' of 4 races are somebody\u2019s answer';
      return tank && tank.raceName === 'Dwarf' && str && str.raceName === 'Orc';
    })(), function () { return window.__racePick; }());

    check('a race nobody wants is a dead option, not an imbalance', (function () {
      /* The rule the whole model exists for. Adding a race that suits
         nothing must not move the measured spread, because no informed
         player would ever roll it. */
      var before = PN.metrics.balanceState(racedDesign());
      var after = PN.metrics.balanceState(racedDesign(function (d) {
        d.races.push(PN.races.newRace({ name: 'Gnome',
          bonuses: [{ kind: 'move', pct: -4 }, { kind: 'hp', pct: -6 }] }));
      }));
      window.__raceDead = 'spread ' + U.round(before.spread, 3) + ' -> ' +
        U.round(after.spread, 3) + ' after adding a race that is worse at everything';
      return Math.abs(after.spread - before.spread) < 0.001;
    })(), function () { return window.__raceDead; }());

    check('a race that is mandatory for one build DOES move the balance', (function () {
      /* The other half: a race good enough to be the right answer
         changes what that build is worth, and the spread has to see it. */
      var before = PN.metrics.balanceState(racedDesign());
      var after = PN.metrics.balanceState(racedDesign(function (d) {
        d.races.push(PN.races.newRace({ name: 'Titan',
          bonuses: [{ kind: 'dmg', pct: 8 }, { kind: 'stat', statId: 'str', pct: 12 }] }));
      }));
      window.__raceLive = 'spread ' + U.round(before.spread, 2) + ' -> ' +
        U.round(after.spread, 2) + ' after adding a race that is the best answer somewhere';
      return Math.abs(after.spread - before.spread) > 0.01;
    })(), function () { return window.__raceLive; }());

    check('a restricted race is not offered to the classes it excludes', (function () {
      var d = racedDesign();
      var builds = PN.builds.enumerate(d);
      var first = builds[0];
      var orc = U.byId(d.races, d.races[3].id);
      orc.allow = [first.playableId];
      U.bumpDesign(d);
      var forFirst = PN.races.legalFor(d, first).length;
      var others = builds.filter(function (b) { return b.playableId !== first.playableId; });
      var offered = others.filter(function (b) {
        return PN.races.legalFor(d, b).filter(function (r) { return r.id === orc.id; }).length;
      }).length;
      window.__raceAllow = orc.name + ' restricted to ' + first.playableName + ': offered to ' +
        forFirst + ' races worth of that build and to ' + offered + ' of ' + others.length +
        ' builds belonging to anybody else';
      return forFirst === 4 && offered === 0;
    })(), function () { return window.__raceAllow; }());

    check('races cost research before you may ship any', (function () {
      var st0 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 4141 });
      var locked = PN.research.limits(st0).races;
      PN.research.ensure(st0).done['races'] = true;
      var open = PN.research.limits(st0).races;
      var node = PN.research.NODE_BY_ID['races'];
      window.__raceGate = 'cap ' + locked + ' -> ' + open + ' once the tier ' +
        (node ? node.tier : '?') + ' node is done';
      return locked === 0 && open >= 4 && node && node.tier === 1;
    })(), function () { return window.__raceGate; }());

    check('players roll a race, and the keen ones roll the right one', (function () {
      var d = racedDesign();
      var st0 = PN.state.newGame({ design: d, seed: 909 });
      st0.phase = 'live'; st0.shipped = U.clone(d); st0.week = 10;
      PN.pop.ensureCohorts(st0); PN.economy.init(st0);
      for (var k = 0; k < 10; k++) {
        st0.studio.cash = Math.max(st0.studio.cash, 400000);
        PN.sim.advance(st0);
        st0.pendingEvents = []; st0.log = st0.log.slice(0, 2);
      }
      var total = 0, withRace = 0, counts = {};
      (st0.agents || []).forEach(function (a) {
        total += a.w;
        if (a.rc) { withRace += a.w; counts[a.rc] = (counts[a.rc] || 0) + a.w; }
      });
      var used = U.keys(counts).length;
      window.__racePop = Math.round(withRace) + ' of ' + Math.round(total) +
        ' players rolled a race, spread across ' + used + ' of ' + d.races.length;
      return total > 0 && withRace === total && used >= 2;
    })(), function () { return window.__racePop; }());

    check('a game with no races gives nobody a race', (function () {
      var d = PN.presets.build('themepark');
      var st0 = PN.state.newGame({ design: d, seed: 910 });
      st0.phase = 'live'; st0.shipped = U.clone(d); st0.week = 10;
      PN.pop.ensureCohorts(st0); PN.economy.init(st0);
      for (var k = 0; k < 6; k++) {
        st0.studio.cash = Math.max(st0.studio.cash, 400000);
        PN.sim.advance(st0);
        st0.pendingEvents = []; st0.log = st0.log.slice(0, 2);
      }
      var raced = (st0.agents || []).filter(function (a) { return a.rc; }).length;
      window.__raceNone = (st0.agents || []).length + ' players, ' + raced + ' with a race';
      return (st0.agents || []).length > 0 && raced === 0;
    })(), function () { return window.__raceNone; }());

    check('the race model does not make balance meaningfully slower', (function () {
      /* Picking the best race by running the solver once per race per
         build is the honest way and about five times too slow, because
         the balance table is rebuilt every week of every save. The
         choice is made on a cheap model and only the winner is
         evaluated for real - so four races must cost about nothing. */
      var plain = PN.presets.build('themepark');
      var raced = racedDesign();
      function timeOf(d) {
        var t = Date.now();
        for (var i = 0; i < 6; i++) { U.bumpDesign(d); PN.combat.evaluateAll(d); }
        return (Date.now() - t) / 6;
      }
      timeOf(plain);                       /* warm */
      var a = timeOf(plain), b = timeOf(raced);
      window.__racePerf = U.round(a, 1) + ' ms with no races, ' + U.round(b, 1) +
        ' ms with four (x' + U.round(b / Math.max(0.01, a), 2) + ')';
      return b < a * 2.2;
    })(), function () { return window.__racePerf; }());

    h('Save / load');
    var json = JSON.stringify(st);
    var back = JSON.parse(json);
    check('state serialises', json.length > 1000, U.fmtCompact(json.length) + ' chars');
    check('round-trips', back.week === st.week && back.population.cohorts.length === st.population.cohorts.length);
    var okAdvance = true;
    try { PN.sim.advance(back); } catch (e) { okAdvance = false; lines.push('<div class="bad">' + e.message + '</div>'); }
    check('loaded save can keep simulating', okAdvance);

  } catch (err) {
    fails++;
    lines.push('<div class="bad">EXCEPTION: ' + err.message + '</div><pre class="bad">' + (err.stack || '') + '</pre>');
  }

  var header = '<h2 class="' + (fails ? 'bad' : 'ok') + '">' +
    (fails ? fails + ' FAILURES' : 'ALL PASS') + '  (' + checks + ' checks)</h2>';
  document.getElementById('out').innerHTML = header + lines.join('');
  window.__RESULT__ = { checks: checks, fails: fails };
})();
</script>
</body>
</html>
