<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Patch Notes - self test</title>
<style>
  body { background:#12141a; color:#d6dae6; font:13px/1.5 ui-monospace,Consolas,monospace; padding:18px; }
  h2 { color:#7fd1ff; margin:22px 0 6px; font-size:14px; }
  .ok { color:#6ee7a0; } .bad { color:#ff7b72; } .warn { color:#ffcb6b; }
  table { border-collapse:collapse; margin:6px 0; }
  td,th { padding:2px 10px 2px 0; text-align:left; border-bottom:1px solid #23262f; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<div id="out">running...</div>

<!--PN_BUNDLE-->
<script>
(function () {
  var U = PN.util, lines = [], fails = 0, checks = 0;
  /* Sections announce themselves. In the browser that is invisible;
     from the command line it is the difference between a quarter of an
     hour of silence and a run you can watch. */
  function h(t) {
    lines.push('<h2>' + t + '</h2>');
    if (typeof PN.onSection === 'function') PN.onSection(t);
  }
  function p(t) { lines.push('<div>' + t + '</div>'); }
  function check(name, cond, detail) {
    checks++;
    if (!cond) fails++;
    lines.push('<div class="' + (cond ? 'ok' : 'bad') + '">' + (cond ? 'PASS' : 'FAIL') +
               '  ' + name + (detail !== undefined ? '  <span style="color:#8b93a7">' + detail + '</span>' : '') + '</div>');
  }

  /* Balance is evaluated per build, so a class or branch no longer has one
     row of its own. bestBuild finds the strongest build made out of a
     given playable, which is the one players would actually be on. */
  function bestBuild(design, evals, playable) {
    var id = playable && playable.id ? playable.id : playable;
    var best = null;
    PN.builds.enumerate(design).forEach(function (b) {
      if (b.playableId !== id) return;
      var ev = evals.byId[b.id];
      if (ev && (!best || ev.dps > best.dps)) best = ev;
    });
    return best;
  }

  try {
    /* ---------------------------------------------------------- utils -- */
    h('Core utilities');
    check('clamp', U.clamp(5, 0, 3) === 3);
    check('saturate monotonic', U.saturate(10, 5) > U.saturate(5, 5));
    var r1 = new U.Rng(42), r2 = new U.Rng(42);
    check('RNG deterministic', r1.next() === r2.next());
    check('gini uniform ~0', U.gini([1, 1, 1, 1]) < 0.01, U.round(U.gini([1, 1, 1, 1]), 4));
    check('gini skewed > 0.4', U.gini([0, 0, 0, 10]) > 0.4, U.round(U.gini([0, 0, 0, 10]), 3));

    /* -------------------------------------------------------- taxonomy - */
    h('Taxonomy');
    var shareSum = U.sum(PN.tax.ARCHETYPES, function (a) { return a.share; });
    check('archetype shares sum to 1', Math.abs(shareSum - 1) < 0.001, U.round(shareSum, 4));
    PN.tax.ARCHETYPES.forEach(function (a) {
      var w = U.sum(PN.tax.AXIS_IDS, function (id) { return a.weights[id]; });
      if (Math.abs(w - 1) > 0.001) { check(a.id + ' weights normalised', false, U.round(w, 4)); fails++; }
    });
    check('all archetype weights normalised', true);
    var mix = PN.tax.marketMix(PN.tax.eraForYear(2004));
    check('market mix sums to 1', Math.abs(U.sum(U.values(mix)) - 1) < 0.001);

    /* --------------------------------------------------------- presets - */
    h('Presets build and evaluate');
    var results = [];
    PN.presets.PRESETS.forEach(function (pr) {
      var d = PN.presets.build(pr.id);
      var coh = PN.coherence.evaluate(d);
      var bal = PN.metrics.balanceState(d);
      var inv = PN.metrics.contentInventory(d);
      var cost = PN.metrics.buildCost(d);
      var ax = PN.axes.compute(d, { era: PN.tax.eraForYear(d.meta.startYear) });
      var vals = PN.axes.values(ax);
      var fit = PN.axes.archetypeFit(d, ax);
      var totalHours = U.sum(PN.tax.CATEGORY_IDS, function (c) { return inv[c]; });
      var best = U.keys(fit).sort(function (a, b) { return fit[b] - fit[a]; });
      results.push({
        id: pr.id, name: pr.name, coh: coh.score, bal: bal.quality, hours: totalHours,
        cost: cost.design + cost.art + cost.eng + cost.qa, vals: vals, fit: fit,
        top: best.slice(0, 3), worst: best.slice(-2)
      });
      check(pr.name + ' builds', d.classes.length > 0 && totalHours > 0,
            d.classes.length + ' classes, ' + U.round(totalHours, 0) + 'h content');
    });

    /* Presets must be meaningfully DIFFERENT from each other. */
    h('Presets are distinct');
    var axisSpread = {};
    PN.tax.AXIS_IDS.forEach(function (id) {
      var vs = results.map(function (r) { return r.vals[id]; });
      axisSpread[id] = U.round(Math.max.apply(null, vs) - Math.min.apply(null, vs), 1);
    });
    var tbl = '<table><tr><th>axis</th><th>range across presets</th></tr>';
    PN.tax.AXIS_IDS.forEach(function (id) {
      tbl += '<tr><td>' + id + '</td><td>' + axisSpread[id] + '</td></tr>';
    });
    tbl += '</table>'; lines.push(tbl);
    var wideAxes = PN.tax.AXIS_IDS.filter(function (id) { return axisSpread[id] > 18; });
    check('presets differ widely on 5+ axes', wideAxes.length >= 5, wideAxes.join(', '));

    var tbl2 = '<table><tr><th>preset</th><th>coherence</th><th>balance</th><th>content h</th><th>build cost</th><th>best fit</th><th>worst fit</th></tr>';
    results.forEach(function (r) {
      tbl2 += '<tr><td>' + r.name + '</td><td>' + U.round(r.coh, 1) + '</td><td>' + U.round(r.bal, 1) +
        '</td><td>' + U.round(r.hours, 0) + '</td><td>' + U.round(r.cost, 0) +
        '</td><td>' + r.top.map(function (t) { return t + ' ' + Math.round(r.fit[t]); }).join(', ') +
        '</td><td>' + r.worst.map(function (t) { return t + ' ' + Math.round(r.fit[t]); }).join(', ') + '</td></tr>';
    });
    tbl2 += '</table>'; lines.push(tbl2);

    check('all presets coherent-ish (>45)', results.every(function (r) { return r.coh > 45; }),
          results.map(function (r) { return r.id + ':' + Math.round(r.coh); }).join(' '));

    /* Sanity: the arena preset should attract competitors, not explorers. */
    var ar = results.filter(function (r) { return r.id === 'arena'; })[0];
    check('arena attracts competitors over explorers', ar.fit.competitor > ar.fit.explorer,
          'comp ' + Math.round(ar.fit.competitor) + ' vs expl ' + Math.round(ar.fit.explorer));
    var cr = results.filter(function (r) { return r.id === 'creature'; })[0];
    check('creature preset attracts completionists', cr.fit.completionist > 45, Math.round(cr.fit.completionist));
    var tp = results.filter(function (r) { return r.id === 'themepark'; })[0];
    check('themepark attracts raiders over drifters', tp.fit.raider > tp.fit.drifter,
          'raider ' + Math.round(tp.fit.raider) + ' vs drifter ' + Math.round(tp.fit.drifter));

    /* ------------------------------------------------------ incoherence - */
    h('Coherence engine reacts to a deliberately muddled design');
    var bad = PN.presets.build('arena');
    bad.identity.world = 'seamless';          /* lobby game with an open world */
    bad.identity.deathPenalty = 'fullLoot';   /* ... and full loot             */
    bad.monetisation.model = 'f2pPower';      /* ... and pay to win            */
    bad.monetisation.shop.push(PN.schema.newShopEntry('power'));
    bad.monetisation.shop[bad.monetisation.shop.length - 1].prominence = 90;
    var badCoh = PN.coherence.evaluate(bad);
    var goodCoh = PN.coherence.evaluate(PN.presets.build('arena'));
    check('muddling a design lowers coherence', badCoh.score < goodCoh.score - 6,
          Math.round(goodCoh.score) + ' -> ' + Math.round(badCoh.score));
    check('conflicts are reported with reasons', badCoh.negatives.length > 0,
          badCoh.negatives.slice(0, 2).map(function (n) { return n.a + '/' + n.b; }).join(', '));

    var badAx = PN.axes.compute(bad, { era: PN.tax.eraForYear(2012) });
    check('pay-to-win craters fairness', PN.axes.values(badAx).fairness < 40,
          Math.round(PN.axes.values(badAx).fairness));

    /* ----------------------------------------------------- boss metrics - */
    h('Encounter design');
    var d2 = PN.presets.build('themepark');
    var boss = d2.bosses[d2.bosses.length - 1];
    var bm = PN.metrics.bossMetrics(d2, boss);
    check('3-phase boss is harder than a dummy', bm.difficulty > 30, Math.round(bm.difficulty));
    var dummy = PN.schema.newBoss('Training Dummy', { phases: [{ name: 'P1', trigger: 'hp', at: 100, mechanics: [], damage: 0 }] });
    var dm = PN.metrics.bossMetrics(d2, dummy);
    check('mechanic-less boss is flagged as a dummy', dm.dummy === true && dm.difficulty < 15, Math.round(dm.difficulty));
    var eliteClear = PN.metrics.clearChance(bm, 1.55, 0.86, 0.9, 0.8);
    var casualClear = PN.metrics.clearChance(bm, 1.55, 0.28, 0.4, 0.3);
    check('elite players clear mythic more often than casuals', eliteClear > casualClear + 0.2,
          'elite ' + U.round(eliteClear, 3) + ' vs casual ' + U.round(casualClear, 3));

    /* ---------------------------------------------------- reward chains - */
    h('Reward chains');
    function mkTestChain(design, name, stages) {
      var steps = stages.map(function (st2, i) {
        var r = PN.items.newReward({ name: name + ' ' + i, xp: st2.xp });
        design.rewards.push(r);
        return { label: 'stage ' + i, rewardId: r.id, gateWeeks: st2.gate, requirement: 'quest' };
      });
      return PN.schema.newRewardChain(name, { steps: steps });
    }
    var front = PN.metrics.rewardChainMetrics(d2, mkTestChain(d2, 'front', [
      { xp: 90000, gate: 0 }, { xp: 20000, gate: 1 }, { xp: 10000, gate: 1 }]));
    var back = PN.metrics.rewardChainMetrics(d2, mkTestChain(d2, 'back', [
      { xp: 10000, gate: 1 }, { xp: 20000, gate: 1 }, { xp: 90000, gate: 2 }]));
    check('chain shapes detected', front.shape === 'front-loaded' && back.shape === 'back-loaded',
          front.shape + ' / ' + back.shape);
    check('back-loaded chains pull harder', back.pull > front.pull,
          U.round(back.pull, 1) + ' vs ' + U.round(front.pull, 1));
    var emptyChain = PN.metrics.rewardChainMetrics(d2, PN.schema.newRewardChain('empty'));
    check('a chain whose stages hand over nothing is flagged',
          emptyChain.emptySteps === 3 && emptyChain.frustration > back.frustration && emptyChain.pull < back.pull,
          emptyChain.emptySteps + ' empty stages: frustration ' + Math.round(emptyChain.frustration) +
          ' vs ' + Math.round(back.frustration) + ', pull ' + Math.round(emptyChain.pull) +
          ' vs ' + Math.round(back.pull));

    /* --------------------------------------------------- full campaign -- */
    h('Full campaign: 160 weeks of Classic Themepark');
    var st = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 12345 });
    /* Staff up so the build actually finishes. */
    var rng = new U.Rng(99);
    ['contentDesigner', 'contentDesigner', 'artistEnv', 'artistEnv', 'artistChar', 'artistVfx',
     'engineerServer', 'engineerTools', 'qa', 'qa', 'encounterDesigner', 'community', 'sre']
      .forEach(function (r) { st.studio.staff.push(PN.state.makeStaff(rng, r, 0.2)); });
    st.runtime.marketingSpend = 60000;

    var launched = false, weeks = 0, maxPop = 0, launchWeek = -1;
    for (var i = 0; i < 160; i++) {
      if (!launched && PN.sim.completion(st).overall >= 1) {
        var lr = PN.sim.launch(st);
        launched = true; launchWeek = st.week;
      }
      PN.sim.advance(st);
      weeks++;
      maxPop = Math.max(maxPop, st.population.total);
      /* Auto-resolve any pending decisions with the first option. */
      while (st.pendingEvents.length) PN.events.resolve(st, st.pendingEvents[0].id, 0);
      /* Ship a patch whenever the build is complete and content is stale. */
      if (launched && st.runtime.weeksSinceContent > 12 && PN.sim.completion(st).overall >= 1) {
        /* Author a little more content, then ship it. */
        var z = PN.schema.newZone('Expansion Zone ' + st.week, { levelLo: 60, levelHi: 60, size: 60, artBudget: 60 });
        st.design.zones.push(z);
        var ql = PN.schema.newQuestline('Patch questline ' + st.week, { zoneId: z.id, quests: [{ type: 'chain', count: 4 }, { type: 'kill', count: 12 }] });
        st.design.questlines.push(ql);
      }
      if (launched && PN.sim.completion(st).overall >= 1 && st.runtime.weeksSinceContent > 4) PN.sim.ship(st);
    }

    check('campaign ran without throwing', true, weeks + ' weeks');
    check('game launched', launched, 'week ' + launchWeek);
    /* The world is scaled 100x down, so a few thousand is a hit. */
    check('acquired a real playerbase', maxPop > 800, 'peak ' + U.fmtInt(maxPop));
    check('history recorded', st.history.length === weeks, st.history.length);
    check('revenue was generated', st.finance.revenueTotal > 0, U.fmtMoney(st.finance.revenueTotal));
    check('events fired', st.log.filter(function (l) { return l.kind === 'crisis' || l.kind === 'community'; }).length > 0,
          st.log.length + ' log entries');
    check('no NaN in population', !isNaN(st.population.total), st.population.total);
    check('no NaN in cash', !isNaN(st.studio.cash), U.fmtMoney(st.studio.cash));

    var satOk = st.population.cohorts.every(function (c) { return !isNaN(c.satisfaction) && c.satisfaction >= 0 && c.satisfaction <= 100; });
    check('all cohort satisfactions in range', satOk);

    var histOk = st.history.every(function (hh) { return !isNaN(hh.total) && !isNaN(hh.revenue); });
    check('history clean', histOk);

    /* Report the shape of the run. */
    var peakW = 0, peakV = 0;
    st.history.forEach(function (hh) { if (hh.total > peakV) { peakV = hh.total; peakW = hh.week; } });
    p('<br>Peak population <b>' + U.fmtInt(peakV) + '</b> at week ' + peakW +
      ', final <b>' + U.fmtInt(st.population.total) + '</b>, cash <b>' + U.fmtMoney(st.studio.cash) +
      '</b>, sentiment <b>' + Math.round(st.runtime.sentiment) + '</b>, review <b>' + Math.round(st.runtime.reviewScore) + '</b>');

    var samples = [launchWeek + 1, launchWeek + 12, launchWeek + 40, launchWeek + 80, weeks - 1];
    var t3 = '<table><tr><th>week</th><th>pop</th><th>joined</th><th>left</th><th>sat</th><th>revenue</th><th>sentiment</th><th>bugs</th></tr>';
    samples.forEach(function (w) {
      var hh = st.history[w]; if (!hh) return;
      t3 += '<tr><td>' + hh.week + '</td><td>' + U.fmtInt(hh.total) + '</td><td>' + U.fmtInt(hh.joined) +
        '</td><td>' + U.fmtInt(hh.left) + '</td><td>' + U.round(hh.satisfaction, 1) + '</td><td>' +
        U.fmtMoney(hh.revenue) + '</td><td>' + U.round(hh.sentiment, 0) + '</td><td>' + U.round(hh.bugLoad, 0) + '</td></tr>';
    });
    t3 += '</table>'; lines.push(t3);

    /* Which cohorts survived? */
    var coSorted = st.population.cohorts.slice().sort(function (a, b) { return b.size - a.size; }).slice(0, 8);
    var t4 = '<table><tr><th>cohort</th><th>size</th><th>satisfaction</th><th>novelty</th><th>supply ratio</th></tr>';
    coSorted.forEach(function (c) {
      t4 += '<tr><td>' + c.arch + '/' + c.band + '</td><td>' + U.fmtInt(c.size) + '</td><td>' +
        U.round(c.satisfaction, 1) + '</td><td>' + U.round(c.novelty, 1) + '</td><td>' +
        U.round(c.supplyRatio || 0, 2) + '</td></tr>';
    });
    t4 += '</table>'; lines.push(t4);

    /* ---------------------------------------------- drought behaviour --- */
    h('Drought: a mature game with the content tap turned off');
    var st2 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 777 });
    var rng2 = new U.Rng(5);
    ['contentDesigner', 'artistEnv', 'artistChar', 'engineerServer', 'qa', 'encounterDesigner',
     'artistVfx', 'engineerTools', 'qa', 'artistEnv', 'contentDesigner', 'community']
      .forEach(function (r) { st2.studio.staff.push(PN.state.makeStaff(rng2, r, 0.3)); });
    st2.runtime.marketingSpend = 50000;

    function settle(s) { while (s.pendingEvents.length) PN.events.resolve(s, s.pendingEvents[0].id, 1); }

    /* Build and launch. */
    for (var j = 0; j < 260 && !st2.launchWeek; j++) {
      if (PN.sim.completion(st2).overall >= 1) PN.sim.launch(st2);
      PN.sim.advance(st2); settle(st2);
    }
    check('drought scenario launched', !!st2.launchWeek, 'week ' + st2.launchWeek);

    /* Forty weeks of a healthy live game: keep authoring and shipping. */
    for (var m = 0; m < 40; m++) {
      if (st2.runtime.weeksSinceContent > 6 && PN.sim.completion(st2).overall >= 1) {
        var zz = PN.schema.newZone('Patch Zone ' + st2.week, { levelLo: 60, levelHi: 60, size: 55, artBudget: 55 });
        st2.design.zones.push(zz);
        st2.design.questlines.push(PN.schema.newQuestline('Patch line ' + st2.week,
          { zoneId: zz.id, quests: [{ type: 'chain', count: 3 }, { type: 'kill', count: 10 }] }));
      }
      if (PN.sim.completion(st2).overall >= 1 && st2.runtime.weeksSinceContent > 3) PN.sim.ship(st2);
      PN.sim.advance(st2); settle(st2);
    }

    /* A drought shows up first in the cohorts that eat the fastest. */
    function engaged(s) {
      return s.population.cohorts.filter(function (c) {
        return c.size > 10 && (c.arch === 'raider' || c.arch === 'completionist' || c.arch === 'creator');
      });
    }
    /* A drought bites through selection and acquisition, not through a
       churn-rate spike: the players who were going to leave leave, and
       the survivors are contented veterans. Measuring the surviving
       raiders' churn chance therefore measures survivorship, which is why
       the headline number here is the size of the raider population. */
    function raiderPop(s) {
      return U.sum(s.agents.filter(function (a) { return a.a === 'raider'; }),
                   function (a) { return a.w; });
    }
    /* Churn pressure at a FIXED tenure, so the veteran discount cannot
       masquerade as retention. */
    function raiderChurnAtTenure(s, tenure) {
      var rs = s.agents.filter(function (a) { return a.a === 'raider'; });
      if (!rs.length) return 0;
      var ctx = { world: { design: PN.sim.live(s) }, lastChurnRate: 0, rng: new U.Rng(1) };
      return U.avg(rs, function (a) {
        return PN.agents.churnChance(s, { a: a.a, b: a.b, sat: a.sat, nov: a.nov,
                                          t: tenure, gid: null, supplyRatio: a.supplyRatio }, ctx);
      });
    }
    var raiderPopBefore = raiderPop(st2);
    var raiderRateBefore = raiderChurnAtTenure(st2, 12);
    var popBefore = st2.population.total;
    var novBefore = U.avg(engaged(st2), function (c) { return c.novelty; });
    var satBefore = U.avg(engaged(st2), function (c) { return c.satisfaction; });
    var stabBefore = U.avg(engaged(st2), function (c) {
      var s = c.axisScores.stability; return s ? s.score : 0; });
    var sentBefore = st2.runtime.sentiment;

    /* Now stop shipping anything at all for sixty weeks.

       With the era held. Sixty weeks is more than a year, and a genre
       that turns over in the middle of the measurement moves what
       everybody scores on stability and grind whatever the studio did.
       This test is about what a DROUGHT does; the decade has tests of
       its own. */
    var heldEra = st2.era;
    for (var k = 0; k < 60; k++) { PN.sim.advance(st2); st2.era = heldEra; settle(st2); }

    var novAfter = U.avg(engaged(st2), function (c) { return c.novelty; });
    var satAfter = U.avg(engaged(st2), function (c) { return c.satisfaction; });

    /* A drought still costs you, but it no longer empties the game on a
       schedule. What players have left to finish carries them through
       it, which is why a quiet year is survivable and a game with
       nothing left in it is not. */
    check('drought drains novelty for engaged players', novAfter < novBefore - 3,
          U.round(novBefore, 1) + ' -> ' + U.round(novAfter, 1) +
          ' over sixty weeks with nothing shipped');
    check('and a quiet year is a STABLE year, which is the other half of it',
      (function () {
        /* This used to assert that a drought lowers satisfaction, and
           it does not - not as a single number, and asserting it hid
           the more interesting thing.

           Satisfaction is ten weighted axes. Shipping nothing for a
           year drains novelty, and it also means shipping no bugs and
           disrupting nobody, so stability climbs to a hundred. On the
           save this was measured against, novelty fell four points and
           stability gained fifteen, and the survivors - who are the
           people content enough not to have left - came out AHEAD on
           the composite.

           So the drought is real and it is expensive: it costs you
           novelty, and it costs you the players who eat content
           fastest, both of which are checked above. What it does not
           do is make the people who stayed unhappy, and a test that
           insisted otherwise was asking the simulation to lie. */
        var stab = U.avg(engaged(st2), function (c) {
          var s = c.axisScores.stability; return s ? s.score : 0; });
        var nov = U.avg(engaged(st2), function (c) {
          var s = c.axisScores.novelty; return s ? s.score : 0; });
        window.__quiet = 'after sixty quiet weeks: novelty ' + U.round(novBefore, 0) +
                         ' -> ' + U.round(nov, 0) + ', stability ' +
                         U.round(stabBefore, 0) + ' -> ' + U.round(stab, 0) +
                         ', satisfaction ' + U.round(satBefore, 1) + ' -> ' +
                         U.round(satAfter, 1);
        /* Novelty falls off a cliff; stability barely moves.

           The claim this test used to make - that a quiet year sends
           stability to a hundred - stopped being true once rivals
           survived long enough to keep pulling at people, because who
           is LEFT after sixty quiet weeks is a different crowd with
           different opinions. What survives the change is the shape
           that matters: a drought is a novelty problem, not a
           stability one, and the people who stay are not the ones it
           made unhappy. */
        return nov < novBefore - 10 && stab > stabBefore - 8 &&
               satAfter > 60;
      })(), function () { return window.__quiet; }());
    /* The hungry cohort is the one that empties out. */
    check('the drought empties out the raiders', raiderPop(st2) < raiderPopBefore * 0.8,
          U.fmtInt(raiderPopBefore) + ' -> ' + U.fmtInt(raiderPop(st2)) + ' raiders');
    /* Novelty is one of ten weighted axes, so a total collapse of it is
       worth single-digit satisfaction points - enough to move the churn
       curve, not enough to empty the game on its own. */
    check('churn pressure at a fixed tenure does not fall',
          raiderChurnAtTenure(st2, 12) >= raiderRateBefore * 0.98,
          U.fmtPct(raiderRateBefore * 100, 2) + ' -> ' +
          U.fmtPct(raiderChurnAtTenure(st2, 12) * 100, 2) + ' per week at 12 weeks tenure');
    var drifterNov = U.avg(st2.population.cohorts.filter(function (c) { return c.arch === 'drifter' && c.size > 10; }),
                           function (c) { return c.novelty; });

    check('the game stops growing', st2.population.total < popBefore,
          U.fmtInt(popBefore) + ' -> ' + U.fmtInt(st2.population.total));
    check('drought sours community sentiment', st2.runtime.sentiment < sentBefore,
          U.round(sentBefore, 1) + ' -> ' + U.round(st2.runtime.sentiment, 1));
    /* Low-time players burn content far more slowly, so a drought reaches
       them last - measured on the agents, since after sixty dry weeks
       there may be very few drifters left to average.               */
    /* Only people who have actually played a week. An arrival admitted
       after the tick - a lapsed player coming back for an event, say -
       has no supply ratio yet, and averaging that in reads as zero. */
    function hasPlayed(a) { return a.supplyRatio !== undefined; }
    var drifterAgents = st2.agents.filter(function (a) {
      return a.a === 'drifter' && hasPlayed(a); });
    var engagedAgents = st2.agents.filter(function (a) {
      return (a.a === 'raider' || a.a === 'completionist' || a.a === 'creator') &&
             hasPlayed(a); });
    check('casuals burn content more slowly than the hungry do',
          !drifterAgents.length || !engagedAgents.length ||
          U.avg(drifterAgents, function (a) { return a.supplyRatio || 0; }) >
          U.avg(engagedAgents, function (a) { return a.supplyRatio || 0; }),
          'supply ratio ' + U.round(U.avg(drifterAgents, function (a) { return a.supplyRatio || 0; }), 2) +
          ' vs ' + U.round(U.avg(engagedAgents, function (a) { return a.supplyRatio || 0; }), 2));

    /* ------------------------------------------------- stats & items --- */
    h('Stat system and item budgets');
    var sd = PN.presets.build('themepark');
    var ss = PN.stats.statSetOf(sd);
    check('design has a stat set', ss.primaries.length > 0 && ss.secondaries.length > 0,
          ss.primaries.length + ' primaries, ' + ss.secondaries.length + ' secondaries');
    var b60 = PN.stats.itemBudget(sd, 60, 'epic', 'chest');
    var b120 = PN.stats.itemBudget(sd, 120, 'epic', 'chest');
    check('item budget grows with item level', b120 > b60 * 2,
          U.round(b60, 0) + ' -> ' + U.round(b120, 0));
    check('a ring is worth less than a chest',
          PN.stats.itemBudget(sd, 60, 'epic', 'ring1') < PN.stats.itemBudget(sd, 60, 'epic', 'chest'));
    check('rarity raises the budget',
          PN.stats.itemBudget(sd, 60, 'legendary', 'chest') > PN.stats.itemBudget(sd, 60, 'common', 'chest'));

    var gen = PN.items.generateGearSet(sd, { itemLevel: 100, rarity: 'epic', prefix: 'Test', seed: 7 });
    check('gear generator fills every slot', gen.length === PN.stats.GEAR_SLOTS.length, gen.length + ' pieces');
    var onBudget = gen.filter(function (g) {
      var cap = PN.stats.itemBudget(sd, g.itemLevel, g.rarity, g.slot);
      var used = PN.stats.budgetUsed(sd, g);
      return used > cap * 0.8 && used < cap * 1.2;
    });
    check('generated gear lands on budget', onBudget.length >= gen.length - 1,
          onBudget.length + '/' + gen.length + ' within 20%');

    /* ------------------------------------------------------ abilities -- */
    h('Ability authoring');
    check('presets instantiate real abilities', sd.abilities.length > 30, sd.abilities.length + ' authored');
    var anyEmpty = sd.abilities.filter(function (a) { return !(a.effects || []).length; });
    check('every authored ability has effects', anyEmpty.length === 0,
          anyEmpty.length ? anyEmpty[0].name : 'all populated');
    var stunAb = PN.abilities.fromTemplate(sd, 'stun');
    check('templates carry real numbers',
          stunAb.cooldown > 0 && PN.abilities.hasEffect(stunAb, 'stun'),
          stunAb.cooldown + 's cd, ' + stunAb.effects.length + ' effect(s)');
    var stunShape = PN.abilities.shape(stunAb);
    check('shape reads hard control', stunShape.hardControlSeconds > 0 && stunShape.isControl,
          U.round(stunShape.hardControlSeconds, 1) + 's');
    check('ability tags are derived from effects',
          PN.abilities.abilityTags(stunAb).indexOf('cc-hard') >= 0,
          PN.abilities.abilityTags(stunAb).join(', '));

    /* ---------------------------------------------------- combat solver - */
    h('Combat solver: time-to-kill is an output');
    var allPresets = PN.presets.PRESETS.map(function (pr) {
      var dd = PN.presets.build(pr.id);
      return { id: pr.id, cm: PN.combat.derivedCombatMath(dd) };
    });
    var ttkRange = allPresets.map(function (x) { return U.round(x.cm.ttkPve, 1); });
    check('PvE time-to-kill is plausible everywhere',
          allPresets.every(function (x) { return x.cm.ttkPve > 5 && x.cm.ttkPve < 60; }),
          ttkRange.join(', ') + ' seconds');
    check('PvP time-to-kill is plausible everywhere',
          allPresets.every(function (x) { return x.cm.ttkPvp > 4 && x.cm.ttkPvp < 90; }),
          allPresets.map(function (x) { return U.round(x.cm.ttkPvp, 1); }).join(', '));
    check('raid clears land in minutes, not hours',
          allPresets.every(function (x) { return x.cm.raidClearSeconds > 60 && x.cm.raidClearSeconds < 1200; }),
          allPresets.map(function (x) { return U.round(x.cm.raidClearSeconds / 60, 1) + 'm'; }).join(', '));

    /* The whole point: editing an ability must move the whole game. */
    var fd = PN.presets.build('themepark');
    var fMage = null;
    fd.classes.forEach(function (c) { if (c.name === 'Mage') fMage = c; });
    var fBeam = null;
    PN.abilities.abilitiesOf(fd, fMage).forEach(function (a) {
      if (a.name.indexOf('Channelled') >= 0) fBeam = a;
    });
    /* Balance is per build now, so a class's number is the number of its
       builds. Take the strongest, which is the one players would play. */
    function bestBuildOf(design, evals, playable) {
      var best = null;
      PN.builds.enumerate(design).forEach(function (b) {
        if (b.playableId !== playable.id) return;
        var ev = evals.byId[b.id];
        if (ev && (!best || ev.dps > best.dps)) best = ev;
      });
      return best;
    }
    function mageState() {
      var cm = PN.combat.derivedCombatMath(fd);
      var ev = bestBuildOf(fd, cm.evaluations, fMage);
      return { dps: ev.dps, ttk: cm.ttkPve,
               bal: PN.metrics.balanceState(fd).quality,
               top: ev.single.casts[0] };
    }
    var s0 = mageState();
    var coef0 = fBeam.effects[0].coef;
    fBeam.effects[0].coef = coef0 * 2;
    var s1 = mageState();
    check('buffing an ability raises that class DPS', s1.dps > s0.dps * 1.3,
          U.fmtCompact(s0.dps) + ' -> ' + U.fmtCompact(s1.dps));
    check('and shortens time-to-kill', s1.ttk < s0.ttk,
          U.round(s0.ttk, 1) + 's -> ' + U.round(s1.ttk, 1) + 's');
    check('and damages game-wide balance', s1.bal < s0.bal - 8,
          Math.round(s0.bal) + ' -> ' + Math.round(s1.bal));

    fBeam.effects[0].coef = coef0 * 0.3;
    var s2 = mageState();
    check('nerfing it makes the solver pick a different rotation',
          s2.top && s0.top && s2.top.ab.id !== s0.top.ab.id,
          (s0.top ? s0.top.ab.name : '?') + ' -> ' + (s2.top ? s2.top.ab.name : '?'));

    fBeam.effects[0].coef = coef0;
    fBeam.resourceCost = 400;
    var s3 = mageState();
    check('an unaffordable kit gets flagged and loses damage',
          bestBuildOf(fd, PN.combat.derivedCombatMath(fd).evaluations, fMage).resourceStarved &&
            s3.dps < s0.dps,
          U.fmtCompact(s0.dps) + ' -> ' + U.fmtCompact(s3.dps));
    fBeam.resourceCost = 40;

    /* Authored gear replaces the synthetic placeholder set, slot by slot. */
    var bareD = PN.schema.newDesign('Bare');
    bareD.classes.push(PN.schema.newClass('Fighter', { role: 'dps' }));
    ['strike', 'heavyStrike', 'execute'].forEach(function (tid) {
      var ab = PN.abilities.fromTemplate(bareD, tid, {});
      bareD.abilities.push(ab);
      bareD.classes[0].abilities.push(ab.id);
    });
    var bareBefore = PN.combat.characterProfile(bareD, bareD.classes[0]);
    check('a design with no gear uses synthetic placeholders',
          bareBefore.authoredSlots === 0, 'all sixteen slots synthesised');
    PN.items.generateGearSet(bareD, { itemLevel: PN.combat.targetItemLevel(bareD),
      rarity: 'epic', prefix: 'Authored',
      primary: PN.combat.primaryFor(bareD, bareD.classes[0]).id, seed: 3 })
      .forEach(function (g) { bareD.items.push(g); });
    var bareAfter = PN.combat.characterProfile(bareD, bareD.classes[0]);
    check('authored gear replaces the synthetic set',
          bareAfter.authoredSlots === PN.stats.GEAR_SLOTS.length,
          bareBefore.authoredSlots + ' -> ' + bareAfter.authoredSlots + ' slots');

    /* Better gear must make the character stronger. */
    var gd = PN.presets.build('themepark');
    var beforeGear = PN.combat.characterProfile(gd, gd.classes[0]);
    var gdIlvl = PN.combat.targetItemLevel(gd);
    PN.items.generateGearSet(gd, { itemLevel: Math.round(gdIlvl * 1.35),
      rarity: 'legendary', prefix: 'Mythic', primary: 'str', seed: 3 })
      .forEach(function (g) { gd.items.push(g); });
    var afterGear = PN.combat.characterProfile(gd, gd.classes[0]);
    check('a better tier raises character power', afterGear.attackPower > beforeGear.attackPower,
          U.fmtCompact(beforeGear.attackPower) + ' -> ' + U.fmtCompact(afterGear.attackPower));

    /* One absurd item must not drag the whole balance model with it. */
    var wildD = PN.presets.build('themepark');
    var baseIlvl = PN.combat.targetItemLevel(wildD);
    var silly = PN.items.newItem({ name: 'Sword of Testing', kind: 'gear', slot: 'mainHand',
      rarity: 'legendary', itemLevel: 9000 });
    PN.stats.autoAllocate(wildD, silly, { str: 3, sta: 1 });
    wildD.items.push(silly);
    check('one absurd item is ignored by the tier model',
          PN.combat.targetItemLevel(wildD) === baseIlvl,
          'item level stays ' + baseIlvl + ' despite a level-9000 sword');
    /* --------------------------------------------------- loot & rewards - */
    h('Items, loot tables and reward bundles');
    var rd = PN.presets.build('themepark');
    var sword = PN.items.newItem({ name: 'Test Blade', kind: 'gear', slot: 'mainHand',
      rarity: 'epic', itemLevel: 120 });
    PN.stats.autoAllocate(rd, sword, { str: 2, sta: 1.5 });
    rd.items.push(sword);
    var gold = PN.items.itemById(rd, 'cur_gold');
    check('starter catalogue exists', !!gold, rd.items.length + ' items');

    var table = PN.items.newLootTable({ name: 'Test Table', rolls: 1,
      entries: [{ itemId: sword.id, weight: 5, qtyMin: 1, qtyMax: 1 },
                { itemId: 'cur_gold', weight: 95, qtyMin: 10, qtyMax: 20 }] });
    rd.lootTables.push(table);
    check('loot tables have an expected value', PN.items.lootValue(rd, table) > 0,
          U.round(PN.items.lootValue(rd, table), 1));

    var lrng = new U.Rng(11), swordDrops = 0, N = 4000;
    for (var li = 0; li < N; li++) {
      PN.items.rollLoot(rd, table, lrng, 0).forEach(function (x) {
        if (x.itemId === sword.id) swordDrops++;
      });
    }
    var dropRate = swordDrops / N;
    check('loot rolls respect the weights', dropRate > 0.03 && dropRate < 0.07,
          U.fmtPct(dropRate * 100, 2) + ' vs 5% expected');

    var bundle = PN.items.newReward({ name: 'Test Reward', xp: 5000,
      items: [{ itemId: sword.id, qty: 1, chance: 1 }], currencies: { cur_gold: 250 } });
    rd.rewards.push(bundle);
    check('reward bundles have a value', PN.items.rewardValue(rd, bundle) > 0,
          U.round(PN.items.rewardValue(rd, bundle), 1));
    var raxes = PN.items.rewardAxes(rd, bundle);
    check('rewards map onto need axes', U.keys(raxes).length > 0, U.keys(raxes).join(', '));
    var cosmetic = PN.items.newItem({ name: 'Fancy Hat', kind: 'cosmetic', rarity: 'epic' });
    check('cosmetics feed identity, gear feeds progression',
          PN.items.itemAxis(cosmetic) === 'identity' && PN.items.itemAxis(sword) === 'progression');

    /* Item budget warnings are the balancing tool. */
    var overloaded = PN.items.newItem({ name: 'Broken', kind: 'gear', slot: 'chest',
      rarity: 'common', itemLevel: 10, stats: { str: 9999 } });
    check('over-budget items are detectable',
          PN.stats.budgetUsed(rd, overloaded) > PN.stats.itemBudget(rd, 10, 'common', 'chest') * 3,
          'used ' + U.fmtInt(PN.stats.budgetUsed(rd, overloaded)));

    /* ------------------------------------- objective-driven quest maths -- */
    h('Quests are defined by their objectives');
    var qd = PN.presets.build('themepark');
    var qq = PN.world.newQuest({ name: 'Test', objectives: [
      { kind: 'kill', targetId: null, count: 10 } ] });
    var qmA = PN.world.questMetrics(qd, qq);
    qq.objectives[0].count = 20;
    var qmB = PN.world.questMetrics(qd, qq);
    check('countable objectives scale content hours',
          qmB.hours > qmA.hours * 1.9, U.round(qmA.hours, 2) + 'h -> ' + U.round(qmB.hours, 2) + 'h');
    var qq2 = PN.world.newQuest({ name: 'Escort', objectives: [
      { kind: 'escort', targetId: null, count: 10 } ] });
    var qmC = PN.world.questMetrics(qd, qq2);
    check('non-countable objectives ignore any count',
          Math.abs(qmC.hours - PN.world.OBJECTIVE_BY_ID.escort.hours) < 0.0001,
          U.round(qmC.hours, 3) + 'h');
    check('only kill/collect/tame are countable',
          PN.world.OBJECTIVE_KINDS.filter(function (k) { return k.countable; })
            .map(function (k) { return k.id; }).sort().join(',') === 'collect,kill,tame',
          PN.world.OBJECTIVE_KINDS.filter(function (k) { return k.countable; })
            .map(function (k) { return k.id; }).join(','));
    check('ten is the authoring baseline', PN.world.DEFAULT_OBJECTIVE_COUNT === 10,
          String(PN.world.DEFAULT_OBJECTIVE_COUNT));
    check('quests no longer carry a type', PN.world.newQuest({}).type === undefined);
    var qmix = PN.world.questMetrics(qd, PN.world.newQuest({ objectives: [
      { kind: 'kill', count: 10 }, { kind: 'talk' }, { kind: 'explore' } ] }));
    check('mixed objectives read as a richer quest', qmix.joy > qmA.joy,
          Math.round(qmA.joy) + ' -> ' + Math.round(qmix.joy));
    check('quest label describes the objectives',
          /Slay/.test(PN.world.questLabel(qd, qq)), PN.world.questLabel(qd, qq));

    /* ================================================== BUILDS =========== */
    h('A build is what a player actually plays');
    var bd = PN.presets.build('themepark');
    var blist = PN.builds.enumerate(bd);
    check('builds are enumerated from the authored kits', blist.length > bd.classes.length,
      blist.length + ' builds from ' + bd.classes.length + ' classes');
    check('a build names its role and its stat',
      blist.every(function (b) { return !!b.buildRole && !!b.buildStat; }));
    check('builds vary by role and by stat', (function () {
      var roles = {}, stats = {};
      blist.forEach(function (b) { roles[b.buildRole] = 1; stats[b.buildStat] = 1; });
      return U.keys(roles).length >= 2 && U.keys(stats).length >= 2;
    })(), (function () {
      var roles = {}, stats = {};
      blist.forEach(function (b) { roles[b.buildRole] = 1; stats[b.buildStat] = 1; });
      return U.keys(roles).join('/') + ' across ' + U.keys(stats).join('/');
    })());

    /* Role capability is read off the kit, not off the label. */
    var tankish = null, healish = null;
    bd.classes.forEach(function (c) {
      var cap = PN.builds.capability(bd, c);
      if (!tankish && cap.tank > 6) tankish = c;
      if (!healish && cap.healer > 6) healish = c;
    });
    check('a kit with taunts and mitigation can tank', !!tankish,
      tankish ? tankish.name : 'none found');
    check('a kit with heals can heal', !!healish, healish ? healish.name : 'none found');
    check('a kit with neither cannot tank', (function () {
      var thin = PN.schema.newDesign('Thin');
      var c = PN.schema.newClass('Striker', { role: 'dps' });
      thin.classes.push(c);
      ['strike', 'heavyStrike'].forEach(function (tid) {
        var ab = PN.abilities.fromTemplate(thin, tid, {});
        thin.abilities.push(ab); c.abilities.push(ab.id);
      });
      return PN.builds.rolesFor(thin, c).indexOf('tank') < 0;
    })());

    /* The stat you gear has to matter, or it is decoration. */
    check('gearing the wrong stat for your kit is genuinely worse', (function () {
      var sd = PN.presets.build('themepark');
      var mage = null;
      sd.classes.forEach(function (c) { if (c.name === 'Mage') mage = c; });
      if (!mage) return false;
      var s = PN.stats.statSetOf(sd);
      var int = U.byId(s.primaries, 'int'), str = U.byId(s.primaries, 'str');
      var right = PN.combat.evaluate(sd, PN.builds.make(sd, mage, 'dps', int));
      var wrong = PN.combat.evaluate(sd, PN.builds.make(sd, mage, 'dps', str));
      return wrong.dps < right.dps * 0.8;
    })(), 'a Strength mage does far less damage than an Intellect one');
    check('a stat that powers almost none of the kit is not offered as a build',
      (function () {
        var sd = PN.presets.build('themepark');
        var mage = null;
        sd.classes.forEach(function (c) { if (c.name === 'Mage') mage = c; });
        return PN.builds.statsFor(sd, mage, 'dps').every(function (p) {
          return p.powers === 'spell' || p.powers === 'both';
        });
      })(), 'no Strength mage build on the menu');

    /* Balance is per build. A class whose tank build is dead is broken
       even if the class average looks fine. */
    var bbal = PN.metrics.balanceState(bd);
    check('balance is measured per build', bbal.perBuild.length === blist.length,
      bbal.perBuild.length + ' build rows');
    check('and still rolls up per class', U.keys(bbal.byPlayable).length === bd.classes.length,
      U.keys(bbal.byPlayable).length + ' classes');
    check('a class with several builds reports its internal spread',
      U.keys(bbal.byPlayable).some(function (k) {
        return bbal.byPlayable[k].builds.length > 1;
      }));

    /* Nobody has to chase the meta, and who does depends on the archetype. */
    check('competitors care about the tier list far more than roleplayers do',
      PN.builds.metaPull('competitor') > PN.builds.metaPull('roleplayer') * 3,
      PN.builds.metaPull('competitor') + ' vs ' + PN.builds.metaPull('roleplayer'));
    check('socialites and roleplayers are drawn to healing',
      PN.builds.roleTaste('socialite', 'healer') > PN.builds.roleTaste('socialite', 'dps') &&
      PN.builds.roleTaste('roleplayer', 'healer') > PN.builds.roleTaste('roleplayer', 'dps'));
    check('a roleplayer will pick a weak build they like', (function () {
      /* Rig the scores so one build is dominant, then see who takes it. */
      var scores = {};
      blist.forEach(function (b, i) { scores[b.id] = i === 0 ? 100 : 20; });
      function share(archId) {
        var rng = new U.Rng(7);
        var hits = 0;
        for (var i = 0; i < 400; i++) {
          var pick = PN.builds.choose(bd, archId, rng, { builds: blist, scores: scores });
          if (pick && pick.id === blist[0].id) hits++;
        }
        return hits / 400;
      }
      var comp = share('competitor'), rp = share('roleplayer');
      window.__metaShare = { comp: comp, rp: rp };
      return comp > rp * 1.5 && rp < 0.5;
    })(), (function () {
      var m = window.__metaShare || {};
      return 'competitors took the best build ' + Math.round((m.comp || 0) * 100) +
             '% of the time, roleplayers ' + Math.round((m.rp || 0) * 100) + '%';
    })());

    /* The trinity creates its own demand, and a shortage pulls people in. */
    var demand = PN.builds.groupDemand(bd);
    check('group content creates demand for tanks and healers',
      demand.tank > 0.1 && demand.healer > 0.1,
      Math.round(demand.tank * 100) + '% tank, ' + Math.round(demand.healer * 100) +
      '% healer for a ' + demand.size + '-player group');
    check('a game with no roles demands none', (function () {
      var nd = PN.presets.build('themepark');
      nd.identity.roles = 'none';
      return PN.builds.groupDemand(nd).tank === 0;
    })());
    check('a tank shortage makes tanking more attractive', (function () {
      var short = PN.builds.roleShortage(bd, { tank: 1, healer: 30, dps: 69 });
      return short.tank > 0.5;
    })(), 'when 1% of players tank, the shortage reads over 50%');
    check('a shortage pushes real players into the gap', (function () {
      var tankBuilds = blist.filter(function (b) { return b.buildRole === 'tank'; });
      if (!tankBuilds.length) return false;
      function tankShare(shortage) {
        var rng = new U.Rng(3), hits = 0;
        for (var i = 0; i < 500; i++) {
          var p = PN.builds.choose(bd, 'progressor', rng, { builds: blist, shortage: shortage });
          if (p && p.buildRole === 'tank') hits++;
        }
        return hits / 500;
      }
      var none = tankShare(null);
      var acute = tankShare({ tank: 1, healer: 0, dps: 0 });
      window.__tankShift = { none: none, acute: acute };
      return acute > none * 1.2;
    })(), (function () {
      var s = window.__tankShift || {};
      return Math.round((s.none || 0) * 100) + '% -> ' + Math.round((s.acute || 0) * 100) +
             '% chose a tank build';
    })());

    /* ================================================= TALENT SYSTEM ==== */
    h('Character system: classes or a talent tree, never both');
    var td = PN.presets.build('themepark');
    check('presets default to a class system',
          td.progression.characterSystem === 'class', td.progression.characterSystem);
    var clsPlayable = PN.schema.playable(td).length;
    check('playable set is the authored classes under a class system',
          clsPlayable === td.classes.filter(function (c) { return c.enabled !== false; }).length,
          clsPlayable + ' playable');

    td.progression.characterSystem = 'talent';
    PN.talents.generateFromClasses(td);
    var tm = PN.talents.treeMetrics(td);
    check('switching to talents folds the classes into a tree',
          tm.branches === td.classes.length && tm.nodes > td.classes.length,
          tm.branches + ' branches, ' + tm.nodes + ' nodes');
    check('the tree grants real abilities, not just percentages',
          tm.abilityNodes > 0, tm.abilityNodes + ' ability nodes');
    check('generated trees leave a real choice at cap',
          tm.reach < 85, U.round(tm.reach, 0) + '% of the tree affordable');

    var builds = PN.talents.builds(td);
    check('every branch compiles to a playable build',
          builds.length === tm.branches && builds.every(function (b) { return b.abilities.length > 0; }),
          builds.map(function (b) { return b.name + ':' + b.abilities.length; }).join(' '));
    check('a build never overspends its point budget',
          builds.every(function (b) { return b.pointsSpent <= b.pointsBudget; }),
          builds.map(function (b) { return b.pointsSpent + '/' + b.pointsBudget; }).join(' '));
    check('builds splash into at most one other branch',
          builds.every(function (b) { return b.splashedInto === null || typeof b.splashedInto === 'string'; }));
    check('branches compile to different builds',
          tm.diversity > 25, U.round(tm.diversity, 0) + '% distinct');
    check('playable set becomes the compiled builds under a talent system',
          PN.schema.playable(td).length === tm.branches, PN.schema.playable(td).length + ' playable');

    /* Exclusive pairs are the whole point of a talent choice. */
    var exBranch = PN.talents.branches(td)[0];
    var exNodes = PN.talents.nodesOf(td, exBranch.id).filter(function (n) { return n.exclusiveWith; });
    if (exNodes.length >= 2) {
      var exBuild = PN.talents.buildFor(td, exBranch);
      var taken = 0;
      exBuild.abilities.length;
      PN.talents.nodesOf(td, exBranch.id).forEach(function (n) { if (n.exclusiveWith === exNodes[0].exclusiveWith) taken++; });
      check('an either/or pair exists to be chosen between', taken >= 2, taken + ' halves');
    }

    /* The tree has to move the actual combat numbers, or it is decoration.
       Measured on the strongest build of the branch, since a branch now
       compiles into several builds. */
    function branchBest(design, evals, branchId) {
      var best = null;
      PN.builds.enumerate(design).forEach(function (b) {
        if (b.playableId !== branchId) return;
        var ev = evals.byId[b.id];
        if (ev && (!best || ev.dps > best.dps)) best = ev;
      });
      return best;
    }
    var firstBranch = PN.talents.branches(td)[0];
    var bDps = branchBest(td, PN.combat.evaluateAll(td), firstBranch.id).dps;
    PN.talents.addNode(td, firstBranch.id, {
      name: 'Test Damage', tier: 1, kind: 'passive', passiveId: 'damage',
      magnitude: 30, ranks: 1, cost: 1
    });
    var aDps = branchBest(td, PN.combat.evaluateAll(td), firstBranch.id).dps;
    check('a damage passive node raises that build\'s damage',
          aDps > bDps * 1.05, U.fmtInt(bDps) + ' -> ' + U.fmtInt(aDps) + ' dps');

    /* Balance and the agent sim both read the same seam. */
    var tbal = PN.metrics.balanceState(td);
    check('balance is computed across the compiled builds',
          U.keys(tbal.byPlayable).length === PN.talents.branches(td).length &&
            tbal.perBuild.length >= PN.talents.branches(td).length,
          tbal.perBuild.length + ' builds across ' + U.keys(tbal.byPlayable).length +
            ' branches, quality ' + Math.round(tbal.quality));
    check('build cost prices the tree, not phantom classes',
          PN.metrics.buildCost(td).design > 0);

    /* The agent sim has to be able to play a talent game. */
    var tstate = PN.state.newGame({ design: td, seed: 2468 });
    var trng = new U.Rng(9);
    ['contentDesigner', 'contentDesigner', 'artistEnv', 'artistChar', 'engineerTools',
     'qa', 'qa', 'encounterDesigner', 'community', 'narrative', 'artistVfx', 'artistEnv']
      .forEach(function (r) { tstate.studio.staff.push(PN.state.makeStaff(trng, r, 0.25)); });
    tstate.runtime.marketingSpend = 600;
    var tLaunched = false;
    for (var ti = 0; ti < 90; ti++) {
      if (!tLaunched && PN.sim.completion(tstate).overall >= 1) { PN.sim.launch(tstate); tLaunched = true; }
      PN.sim.advance(tstate);
      while (tstate.pendingEvents.length) PN.events.resolve(tstate, tstate.pendingEvents[0].id, 0);
    }
    var repped = {};
    tstate.agents.forEach(function (a) { repped[a.cls] = 1; });
    check('simulated players pick talent builds to play',
          tstate.agents.length > 0 && U.keys(repped).length > 1,
          tstate.agents.length + ' players across ' + U.keys(repped).length + ' builds');

    /* Switching back must restore the classes untouched. */
    td.progression.characterSystem = 'class';
    check('switching back restores the class system intact',
          PN.schema.playable(td).length === clsPlayable, PN.schema.playable(td).length + ' classes');

    /* One preset ships classless, so the mode is exercised end to end. */
    var gd = PN.presets.build('grind');
    check('the action sandbox preset ships as a talent game',
          PN.talents.isTalentMode(gd) && PN.talents.tree(gd).branches.length > 0,
          PN.talents.tree(gd).branches.length + ' branches');
    check('a talent preset still has plausible time-to-kill',
          PN.combat.derivedCombatMath(gd).ttkPvp > 4,
          U.round(PN.combat.derivedCombatMath(gd).ttkPvp, 1) + 's');

    /* PvP damping is a real lever now, not a fudge factor. */
    h('PvP damping controls duel length');
    var pd = PN.presets.build('themepark');
    var lowT = (function () { pd.pvp.damping = 0; return PN.combat.derivedCombatMath(pd).ttkPvp; })();
    var highT = (function () { pd.pvp.damping = 60; return PN.combat.derivedCombatMath(pd).ttkPvp; })();
    check('more damping means longer duels', highT > lowT * 1.8,
          U.round(lowT, 1) + 's at 0% -> ' + U.round(highT, 1) + 's at 60%');


    /* ============================================ WORLD & QUESTS ======= */
    h('World: zones own monsters, questgivers and quests');
    var wd = PN.presets.build('themepark');
    check('presets build populated zones',
      wd.zones.length > 0 && wd.monsters.length > 10 && wd.questgivers.length > 4 && wd.quests.length > 20,
      wd.zones.length + ' zones, ' + wd.monsters.length + ' monsters, ' +
      wd.questgivers.length + ' NPCs, ' + wd.quests.length + ' quests');

    var everyMonsterPlaced = wd.monsters.every(function (m) { return !!m.zoneId; });
    check('every monster lives in a zone', everyMonsterPlaced);
    var everyQuestPlaced = wd.quests.every(function (q) { return !!q.zoneId && !!q.giverId; });
    check('every quest is in a zone and has a giver', everyQuestPlaced);
    var everyQuestPays = wd.quests.every(function (q) { return !!q.rewardId; });
    check('every quest hands out a real reward bundle', everyQuestPays);

    var z0 = wd.zones[0];
    check('zone lookups work',
      PN.world.monstersIn(wd, z0.id).length > 0 && PN.world.questsIn(wd, z0.id).length > 0,
      PN.world.monstersIn(wd, z0.id).length + ' monsters in ' + z0.name);

    /* Quests point at things that exist. */
    var brokenQuests = wd.quests.filter(function (q) {
      return PN.world.questIssues(wd, q).length > 0; });
    check('authored quests are completable', brokenQuests.length === 0,
      brokenQuests.length ? PN.world.questIssues(wd, brokenQuests[0])[0] : 'no dangling references');

    /* Deleting a monster a quest needs must be detected. */
    var killQuest = null;
    wd.quests.forEach(function (q) {
      if (!killQuest && (q.objectives || []).some(function (o) { return o.kind === 'kill' && o.targetId; }))
        killQuest = q;
    });
    if (killQuest) {
      var victimId = null;
      killQuest.objectives.forEach(function (o) { if (o.kind === 'kill' && o.targetId) victimId = o.targetId; });
      U.removeById(wd.monsters, victimId);
      check('deleting a monster breaks its quest, and we notice',
        PN.world.questIssues(wd, killQuest).length > 0,
        PN.world.questIssues(wd, killQuest).join('; '));
    }

    var genZone = PN.schema.newZone('Test Vale', { levelLo: 1, levelHi: 12 });
    var genDesign = PN.presets.build('creature');
    genDesign.zones.push(genZone);
    var before = genDesign.monsters.length;
    PN.world.applyGenerated(genDesign,
      PN.world.generateZoneContent(genDesign, genZone, { seed: 3, monsters: 5, givers: 2, quests: 7 }));
    check('the zone generator populates a zone',
      PN.world.monstersIn(genDesign, genZone.id).length === 5 &&
      PN.world.questsIn(genDesign, genZone.id).length === 7 &&
      PN.world.giversIn(genDesign, genZone.id).length === 2,
      '5 monsters, 2 NPCs, 7 quests, all wired');
    check('generated quests all pay out',
      PN.world.questsIn(genDesign, genZone.id).every(function (q) { return !!q.rewardId; }));

    var mob = PN.world.monstersIn(genDesign, genZone.id)[0];
    check('monsters have combat stats derived from the design',
      PN.world.monsterProfile(genDesign, mob).health > 0 && PN.world.monsterXp(genDesign, mob) > 0,
      U.fmtCompact(PN.world.monsterProfile(genDesign, mob).health) + ' hp, ' +
      U.fmtCompact(PN.world.monsterXp(genDesign, mob)) + ' xp');

    /* ================================================== PvE STRUCTURE == */
    h('PvE: dungeons in zones, bosses in dungeons, loot attached');
    var pd = PN.presets.build('themepark');
    check('every dungeon sits in a zone', pd.dungeons.every(function (x) { return !!x.zoneId; }));
    check('every boss sits in a dungeon', pd.bosses.every(function (b) { return !!b.dungeonId; }));
    check('every boss drops something', pd.bosses.every(function (b) { return !!b.lootTableId; }));
    check('every dungeon has a completion reward',
      pd.dungeons.every(function (x) { return !!x.completionRewardId; }));

    var raid = null;
    pd.dungeons.forEach(function (x) { if (x.kind === 'raid') raid = x; });
    check('bossesIn returns the dungeon roster in order',
      raid && PN.schema.bossesIn(pd, raid).length === 2,
      raid ? PN.schema.bossesIn(pd, raid).map(function (b) { return b.name; }).join(' -> ') : 'no raid');

    var dmRaid = PN.metrics.dungeonMetrics(pd, raid);
    check('loot makes a dungeon worth repeating', dmRaid.lootPerRun > 0 && dmRaid.replayFactor > 1,
      'loot/run ' + Math.round(dmRaid.lootPerRun) + ', replay ' + U.round(dmRaid.replayFactor, 2) + 'x');

    var integ = PN.metrics.integrity(pd);
    check('a fully-wired preset has no broken links', integ.bad === 0,
      integ.bad + ' errors, ' + integ.warn + ' warnings');

    var orphan = PN.presets.build('themepark');
    orphan.bosses[0].dungeonId = null;
    check('an orphaned boss is reported as unreachable',
      PN.metrics.integrity(orphan).bad > 0,
      PN.metrics.integrity(orphan).issues[0].what);

    /* ================================================ REWARD HOOKUP ==== */
    h('Rewards reach players from every source');
    var rdz = PN.presets.build('arena');
    var bpTiers = rdz.monetisation.battlePass.tiers || [];
    check('the battle pass has real tiers with real rewards',
      bpTiers.length > 20 && bpTiers.every(function (t) { return !!t.premiumRewardId; }),
      bpTiers.length + ' tiers');
    check('PvP seasons hand out rewards',
      !!rdz.pvp.seasonRewardId && !!PN.items.lootById(rdz, rdz.pvp.matchLootId),
      'a season bundle and a match loot table');

    var chainD = PN.presets.build('themepark');
    var chain = chainD.rewardChains[0];
    var cmm = PN.metrics.rewardChainMetrics(chainD, chain);
    check('reward chain stages point at real bundles', cmm.emptySteps === 0 && cmm.payoff > 0,
      cmm.steps + ' stages, payoff ' + Math.round(cmm.payoff) + ', ' + cmm.shape);

    /* ================================================ AGENT SIMULATION = */
    h('Per-player simulation');
    var ad = PN.presets.build('themepark');
    var ast = PN.state.newGame({ design: ad, seed: 31337 });
    var arng = new U.Rng(5);
    ['contentDesigner', 'contentDesigner', 'artistEnv', 'artistEnv', 'artistChar', 'artistVfx',
     'engineerTools', 'qa', 'qa', 'encounterDesigner', 'community', 'narrative']
      .forEach(function (r) { ast.studio.staff.push(PN.state.makeStaff(arng, r, 0.25)); });
    ast.runtime.marketingSpend = 600;

    var aLaunched = false;
    /* Long enough to launch, patch, hire and settle. Populations are
       far larger than they were, so this is the expensive test in the
       suite and does not need to be twice as long as it is. */
    for (var ai = 0; ai < 110; ai++) {
      if (!aLaunched && PN.sim.completion(ast).overall >= 1) { PN.sim.launch(ast); aLaunched = true; }
      PN.sim.advance(ast);
      while (ast.pendingEvents.length) PN.events.resolve(ast, ast.pendingEvents[0].id, 0);
      if (aLaunched && PN.sim.completion(ast).overall >= 1 && ast.runtime.weeksSinceContent > 6)
        PN.sim.ship(ast);
      if (aLaunched && ast.studio.staff.length < 15 && ast.studio.cash > 250000 && ai % 6 === 0)
        ast.studio.staff.push(PN.state.makeStaff(arng, ai % 2 ? 'contentDesigner' : 'artistEnv', 0.2));
    }
    check('the game launched and acquired players', aLaunched && ast.population.total > 300,
      'launched week ' + ast.launchWeek + ', peak ' + U.fmtInt(ast.population.peak));
    /* One agent per player, up to the roster cap. Population is a float
       sum of agent weights, so compare proportionally rather than
       demanding the two integers match.

       Past the cap the roster stops growing and each surviving agent
       stands in for more than one player - that is what the weight is
       for. What must never happen is the roster silently swapping the
       people you were following for different ones, which is what the
       old random sample did. */
    check('every player is an individual agent', (function () {
      if (!ast.agents.length) return false;
      var ratio = ast.population.total / ast.agents.length;
      var heaviest = 0;
      ast.agents.forEach(function (a) { heaviest = Math.max(heaviest, a.w); });
      var atCap = ast.agents.length >= PN.agents.MAX_AGENTS * 0.98;
      window.__roster = { n: ast.agents.length, heaviest: heaviest,
                          atCap: atCap, ratio: ratio };
      /* Below the cap it is one agent per player. At the cap the roster
         stops growing and the weights carry the rest, which is the
         whole point of having a cap. */
      if (atCap) return ratio > 0.99 && heaviest > 1;
      return ratio > 0.99 && ratio < 1.01 && heaviest < 1.5;
    })(),
      U.fmtInt(ast.agents.length) + ' agents for ' + U.fmtInt(ast.population.total) + ' players');

    check('the roster follows the same people week to week', (function () {
      /* Push a population past the cap and compact it twice. The names
         on the roster must be the same names. */
      var rst2 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 8 });
      rst2.phase = 'live'; rst2.shipped = U.clone(rst2.design);
      rst2.agents = [];
      for (var i = 0; i < PN.agents.MAX_AGENTS + 400; i++) {
        rst2.agents.push({ id: i, nm: 'P' + i, a: 'progressor', w: 1,
                           lv: 1 + (i % 40), t: i % 90, g: {}, inv: {}, cur: {} });
      }
      var rng2 = new U.Rng(3);
      PN.agents.compact(rst2, rng2);
      var first = rst2.agents.map(function (a) { return a.id; }).sort().join(',');
      /* More arrivals, another compaction. */
      for (var j = 0; j < 300; j++) {
        rst2.agents.push({ id: 90000 + j, nm: 'N' + j, a: 'progressor', w: 1,
                           lv: 1, t: 0, g: {}, inv: {}, cur: {} });
      }
      PN.agents.compact(rst2, rng2);
      var second = rst2.agents.map(function (a) { return a.id; }).sort().join(',');
      window.__stable = first === second;
      return first === second;
    })(), 'the newcomers wait; nobody established is swapped out');

    check('and a compaction keeps the population whole', (function () {
      var rst3 = PN.state.newGame({ design: PN.presets.build('themepark'), seed: 9 });
      rst3.agents = [];
      for (var i = 0; i < PN.agents.MAX_AGENTS + 250; i++) {
        rst3.agents.push({ id: i, nm: 'P' + i, a: 'raider', w: 1,
                           lv: 1, t: i % 50, g: {}, inv: {}, cur: {} });
      }
      var before = U.sum(rst3.agents, function (a) { return a.w; });
      PN.agents.compact(rst3, new U.Rng(1));
      var after = U.sum(rst3.agents, function (a) { return a.w; });
      return Math.abs(before - after) < 0.01;
    })(), 'the players who did not make the roster ride on the ones who did');

    var capped = ast.agents.filter(function (a) { return a.lv >= ad.progression.levelCap; });
    check('players level up to the cap', capped.length > 0,
      U.fmtInt(capped.length) + ' at cap out of ' + U.fmtInt(ast.agents.length));
    /* Gear is a function of time played, so ask the question of the people
       who have had the time: a level-capped player should be wearing what
       they found. Counting the whole population measures how many players
       are still levelling, which is a different claim entirely. */
    var geared = ast.agents.filter(function (a) { return U.keys(a.g).length >= 8; });
    var atCap = ast.agents.filter(function (a) { return a.lv >= ad.progression.levelCap; });
    var gearedAtCap = atCap.filter(function (a) { return U.keys(a.g).length >= 8; });
    check('players equip gear they looted',
      geared.length > ast.agents.length * 0.15 &&
      (!atCap.length || gearedAtCap.length > atCap.length * 0.6),
      U.fmtInt(geared.length) + ' with 8+ slots filled, ' +
      U.fmtInt(gearedAtCap.length) + ' of ' + U.fmtInt(atCap.length) + ' at cap');


    var withBags = ast.agents.filter(function (a) { return U.keys(a.inv).length > 0; });
    var withGold = ast.agents.filter(function (a) { return U.keys(a.cur).length > 0; });
    check('players carry inventory and currency',
      withBags.length > 0 && withGold.length > ast.agents.length * 0.5,
      U.fmtInt(withBags.length) + ' with items, ' + U.fmtInt(withGold.length) + ' with currency');

    var questing = ast.agents.filter(function (a) { return a.qd > 0; });
    var killing = ast.agents.filter(function (a) { return a.bk > 0; });
    check('players complete quests and kill bosses',
      questing.length > 0 && killing.length > 0,
      U.fmtInt(questing.length) + ' questers, ' + U.fmtInt(killing.length) + ' boss killers');

    check('players belong to classes', ast.agents.every(function (a) { return !!a.cls; }));
    var sample = ast.agents[0];
    var sheet = PN.agents.describe(ast, sample);
    check('a character sheet can be produced for any player',
      sheet.gear.length === PN.stats.GEAR_SLOTS.length && typeof sheet.gearScore === 'number',
      'player #' + sample.id + ', item level ' + Math.round(sheet.gearScore));

    /* Shrinking the genre is what makes simulating every player
       affordable, and what makes a penetration figure readable. The
       exact factor is a dial; that it is small enough to move is the
       thing worth asserting. */
    check('the world is scaled so every player can be simulated',
      PN.tax.MARKET_SCALE >= 50 && PN.tax.marketPool(ast.era) < 400000,
      'addressable market ' + U.fmtCompact(PN.tax.marketPool(ast.era)) +
      ', shrunk ' + PN.tax.MARKET_SCALE + 'x from the real genre');

    /* =========================================================== GUILDS */
    h('Guilds and churn contagion');
    check('guilds form', PN.guilds.top(ast, 999).length > 5,
      PN.guilds.top(ast, 999).length + ' active guilds');
    var guilded = U.sum(ast.agents.filter(function (a) { return !!a.gid; }), function (a) { return a.w; });
    check('a real share of players are in one', guilded > ast.population.total * 0.15,
      U.fmtPct((guilded / Math.max(1, ast.population.total)) * 100) + ' guilded');

    /* A guild with more social systems behind it holds together better. */
    var bare = PN.presets.build('themepark');
    bare.social = U.merge(bare.social, { guildPerks: false, guildProgression: false,
      guildHalls: false, guildFinder: false, guildSize: 20, communityTools: 5 });
    var rich = PN.presets.build('themepark');
    rich.social = U.merge(rich.social, { guildPerks: true, guildProgression: true,
      guildHalls: true, guildFinder: true, guildSize: 500, communityTools: 90 });
    check('guild support depends on what the design provides',
      PN.guilds.support(rich) > PN.guilds.support(bare) + 0.2,
      U.round(PN.guilds.support(bare), 2) + ' -> ' + U.round(PN.guilds.support(rich), 2));

    /* ========================================================== ECONOMY */
    h('The economy is counted, not estimated');
    var erep = PN.economy.report(ast);
    check('currency supply is measured from actual purses', erep.supply > 0,
      U.fmtCompact(erep.supply) + ' in circulation');
    check('faucets and sinks are both tracked', erep.faucet > 0 && erep.sink > 0,
      'faucet ' + U.fmtCompact(erep.faucet) + ', sink ' + U.fmtCompact(erep.sink));
    check('inflation stays in a sane band over a long run',
      erep.inflation > 0.4 && erep.inflation < 2.5,
      U.round(erep.inflation, 2) + 'x year on year (' + erep.verdict + ')');

    /* ================================================ LOOT VOLUME ======= */
    h('How much drops is something you set');
    var ld = PN.presets.build('themepark');
    var ltbl = ld.lootTables.filter(function (t) { return (t.entries || []).length > 2; })[0];
    check('a loot table has a chance to drop nothing',
      ltbl && ltbl.dropChance !== undefined && ltbl.dropChance < 100,
      ltbl ? ltbl.dropChance + '% per draw' : 'no table');
    check('drop chance actually gates the roll', (function () {
      var t = PN.items.newLootTable({ name: 'T', rolls: 1, dropChance: 0,
        entries: [{ itemId: ld.items[0].id, weight: 1, qtyMin: 1, qtyMax: 1 }] });
      var rng = new U.Rng(3), n = 0;
      for (var i = 0; i < 500; i++) n += PN.items.rollLoot(ld, t, rng, 0).length;
      return n === 0;
    })(), 'a 0% table drops nothing at all');
    check('simulated drops match the predicted rate', (function () {
      var rng = new U.Rng(11), n = 0;
      for (var i = 0; i < 4000; i++) n += PN.items.rollLoot(ld, ltbl, rng, 0, { share: 1 }).length;
      var actual = n / 4000;
      ld.gearing.lootMode = 'personal';
      var predicted = PN.items.expectedDrops(ld, ltbl, 1);
      window.__lootRate = { actual: actual, predicted: predicted };
      return Math.abs(actual - predicted) < 0.08;
    })(), (function () {
      var r = window.__lootRate || {};
      return U.round(r.actual, 2) + ' per open against a predicted ' + U.round(r.predicted, 2);
    })());

    /* Loot mode was authored and did nothing at all, which is why players
       ended up with far more gear than the tables said. */
    check('personal loot gives every player the whole table', (function () {
      ld.gearing.lootMode = 'personal';
      return PN.items.lootShare(ld, 5) === 1;
    })());
    check('group loot divides a drop across the group', (function () {
      ld.gearing.lootMode = 'group';
      return Math.abs(PN.items.lootShare(ld, 5) - 0.2) < 0.001 &&
             Math.abs(PN.items.lootShare(ld, 25) - 0.04) < 0.001;
    })(), 'one fifth in a five-player group, one twenty-fifth in a raid');
    check('and that shows up in what actually drops', (function () {
      ld.gearing.lootMode = 'group';
      var rng = new U.Rng(4), n = 0;
      var share = PN.items.lootShare(ld, 5);
      for (var i = 0; i < 4000; i++) n += PN.items.rollLoot(ld, ltbl, rng, 0, { share: share }).length;
      var personal = PN.items.expectedDrops(ld, ltbl, 1);
      ld.gearing.lootMode = 'personal';
      return (n / 4000) < personal * 0.4;
    })(), 'a group-loot boss hands one player far less than a personal-loot one');

    /* ==================================================== CRAFTING ======= */
    h('Crafting turns materials into things');
    var cd = PN.presets.build('themepark');
    var crafted = PN.crafting.generate(cd, { rng: new U.Rng(5) });
    check('recipes can be generated from what already exists',
      crafted.length > 3, crafted.length + ' recipes');
    check('a recipe costs materials and makes something', (function () {
      return crafted.every(function (r) {
        return r.outputId && (r.inputs || []).length > 0;
      });
    })());
    /* Every generated recipe, not most of them, and across several seeds -
       the reagent sizing used to overshoot its budget on small numbers and
       the failure only showed up on some seeds. */
    check('every generated recipe is worth making', (function () {
      var worst = Infinity, worstName = '', total = 0;
      for (var s = 1; s <= 8; s++) {
        var gd = PN.presets.build('themepark');
        PN.crafting.generate(gd, { rng: new U.Rng(s) }).forEach(function (r) {
          var m = PN.crafting.recipeMetrics(gd, r);
          total++;
          if (m.ratio < worst) { worst = m.ratio; worstName = r.name + ' (seed ' + s + ')'; }
        });
      }
      window.__genWorst = { ratio: worst, name: worstName, total: total };
      return worst >= 1;
    })(), (function () {
      var w = window.__genWorst || {};
      return w.total + ' recipes across eight seeds, thinnest margin ' +
             U.round(w.ratio, 2) + 'x on ' + w.name;
    })());
    /* A trade good nothing consumes, priced above what it sells for, is a
       dead end and always was. Gear and chain steps are not - see below. */
    check('the game says so when a trade good costs more than it makes', (function () {
      var junk = PN.items.newItem({ name: 'Junk', kind: 'material', vendorValue: 1, itemLevel: 1 });
      cd.items.push(junk);
      var bad = PN.crafting.newRecipe({
        name: 'Bad', outputId: junk.id,
        inputs: cd.items.filter(function (i) { return i.kind === 'material' && i.id !== junk.id; })
          .slice(0, 2).map(function (m) { return { itemId: m.id, qty: 40 }; })
      });
      U.bumpDesign(cd);
      return PN.crafting.recipeIssues(cd, bad).some(function (s) { return /dead end/i.test(s); });
    })());

    /* ============================================ TALENT TREE SHAPE ====== */

    /* =========================================== CRAFTING IS WIRED IN === */
    h('Crafting is wired into everything else');
    var wd = PN.presets.build('themepark');

    check('binding decides what can be traded', (function () {

      td.items.forEach(function (i) { i.bind = 'pickup'; });

    check('the draft and the shipped design do not share one cache slot', (function () {

    /* ============================================= OLD SAVES STILL RUN === */

    check('a talent branch with no tier gate still builds a character', (function () {

    /* ========================================== WHAT DRIVES A STAT ====== */
    h('Which stat a class gears for');
    function threeStat() {
      var x = PN.presets.build('themepark');
      x.stats.primaries = [
        { id: 'str', name: 'Strength',   powers: 'attack', roles: ['tank', 'dps'] },
        { id: 'dex', name: 'Dexterity',  powers: 'attack', roles: ['dps'] },
        { id: 'sp',  name: 'Spellpower', powers: 'spell',  roles: ['healer', 'dps'] }];
      U.bumpDesign(x);
      return x;
    }

    /* The label under the class editor and the builds in the balance table
       are two different functions. They used to disagree: one counted
       buttons, the other weighed output, so a mage read as Dexterity. */
    check('the derived stat agrees with the builds that open', (function () {
      var x = threeStat();
      return x.classes.every(function (c) {
        var derived = PN.combat.primaryFor(x, c);
        var opens = PN.builds.statsFor(x, c, c.role);
        if (!opens.length) return false;
        /* The derived stat must at least run on the same power as one of
           the builds the kit actually supports. */
        return opens.some(function (p) {
          return p.powers === derived.powers || p.powers === 'both' ||
                 derived.powers === 'both'; });
      });
    })(), 'no class is told one thing and given another');

    check('output decides, not button count', (function () {
      var x = threeStat();
      var c = PN.schema.newClass('Testcaster');
      /* One enormous spell against five tiny physical utilities. By
         headcount this kit is physical; by output it plainly is not. */
      var big = PN.abilities.newAbility({ name: 'Big Spell', school: 'fire',
        effects: [PN.abilities.newEffect('damage', { coef: 9 })] });
      x.abilities.push(big);
      c.abilities = [big.id];
      for (var i = 0; i < 5; i++) {
        var small = PN.abilities.newAbility({ name: 'Poke ' + i, school: 'physical',
          effects: [PN.abilities.newEffect('damage', { coef: 0.2 })] });
        x.abilities.push(small);
        c.abilities.push(small.id);
      }
      x.classes.push(c);
      U.bumpDesign(x);
      return PN.combat.primaryFor(x, c).id === 'sp';
    })(), 'five pokes do not outvote one fireball');

    /* The school says what the damage is. What it scales off is a second
       question, and it has to be answerable or a holy melee class cannot
       exist - which is the bug this test exists for. */
    check('school and scaling are separate questions', (function () {
      var x = threeStat();
      var war = U.byId(x.classes, x.classes[0].id);
      var kit = PN.abilities.abilitiesOf(x, war);
      kit.forEach(function (a) { if (a.school === 'physical') a.school = 'holy'; });
      U.bumpDesign(x);
      var drifted = PN.combat.primaryFor(x, war).id;
      kit.forEach(function (a) { if ((a.range || 0) <= 5) a.scalesOff = 'attack'; });
      U.bumpDesign(x);
      var pinned = PN.combat.primaryFor(x, war).id;
      window.__holyMelee = { drifted: drifted, pinned: pinned };
      /* Still a holy-school kit: resistances, not armour, reduce it. */
      var stillHoly = kit.every(function (a) { return a.school === 'holy'; });
      return drifted === 'sp' && pinned === 'str' && stillHoly;
    })(), (function () {
      var m = window.__holyMelee || {};
      return 'a holy melee kit reads ' + m.drifted + ' until you say it swings, then ' + m.pinned;
    })());

    check('and that changes the damage, not just the label', (function () {
      var x = threeStat();
      var ab = PN.abilities.newAbility({ name: 'Hammer', school: 'holy',
        effects: [PN.abilities.newEffect('damage', { coef: 3 })] });
      x.abilities.push(ab);
      var c = PN.schema.newClass('Hammerer');
      c.role = 'dps'; c.abilities = [ab.id]; c.primaryStat = 'str';
      c.specs = [{ id: 'spc1', name: 'Base', role: 'dps', abilities: [ab.id] }];
      x.classes.push(c);
      U.bumpDesign(x);
      var asSpell = PN.combat.evaluate(x, c).dps;
      ab.scalesOff = 'attack';
      U.bumpDesign(x);
      var asAttack = PN.combat.evaluate(x, c).dps;
      window.__scaleSwing = { spell: asSpell, attack: asAttack };
      return asAttack > asSpell * 1.3;
    })(), (function () {
      var s = window.__scaleSwing || {};
      return 'a Strength character swinging it does ' + U.fmtInt(s.spell) +

    })());

    check('an explicit primary stat beats everything derived', (function () {
      var x = threeStat();
      var priest = x.classes.filter(function (c) { return c.name === 'Priest'; })[0];
      priest.primaryStat = 'str';
      U.bumpDesign(x);
      return PN.combat.primaryFor(x, priest).id === 'str' &&
             PN.builds.statsFor(x, priest, priest.role).length === 1 &&

    check('a talent branch can pin its stat too', (function () {
      var x = threeStat();

      PN.talents.generateFromClasses(x);
      var br = PN.talents.branches(x)[0];
      br.primaryStat = 'dex';
      U.bumpDesign(x);
      var b = PN.talents.buildFor(x, br);
      return b.primaryStat === 'dex' && PN.combat.primaryFor(x, b).id === 'dex';
    })(), 'the field the branch always had is now reachable');

    check('two stats on the same power are both real builds', (function () {
      var x = threeStat();
      var rogue = x.classes.filter(function (c) { return c.name === 'Rogue'; })[0];
      var opens = PN.builds.statsFor(x, rogue, 'dps').map(function (p) { return p.id; });
      return opens.indexOf('str') >= 0 && opens.indexOf('dex') >= 0;
    })(), 'a physical kit opens every attack-power stat that names its role');

    check('an old ability with no scaling field still works', (function () {
      var x = threeStat();
      x.abilities.forEach(function (a) { delete a.scalesOff; });
      U.bumpDesign(x);
      return PN.abilities.powerKind(x, x.abilities.filter(function (a) {

    /* Two stats on the same power class are the case the old model could

    check('an ability can name one of your own stats', (function () {
      var x = threeStat();

        scalesOff: 'dex',

    check('Strength and Dexterity stop being the same stat', (function () {

      x.abilities.push(dagger);
      function dpsGearedFor(statId) {
        var c = PN.schema.newClass('Knife');

      var offStat = dpsGearedFor('str');

    check('naming a stat decides which build opens', (function () {

    check('the loose form still credits every stat of its class', (function () {

    check('a kit split between two stats opens both', (function () {

    check('off-stat power matches what the old flat multiplier gave', (function () {

      x.stats.primaries.forEach(function (p) {

    check('a renamed or deleted stat does not silently zero an ability', (function () {

    /* ============================================ GEAR FITS THE BUILD === */
    h('Players wear gear for the build they play');
    var gd = PN.presets.build('themepark');
    gd.stats.primaries = [
      { id: 'str', name: 'Strength',   powers: 'attack', roles: ['tank', 'dps'] },

      { id: 'sp',  name: 'Spellpower', powers: 'spell',  roles: ['healer', 'dps'] }];
    /* Two chests: a better one for somebody else, a worse one for them. */

    var dexChest = PN.items.newItem({ name: 'Leather of Dexterity', kind: 'gear', slot: 'chest',
      rarity: 'epic', itemLevel: 140, stats: { dex: 240, sta: 160 } });
    gd.items.push(strChest); gd.items.push(dexChest);

    check('and a Strength player takes the Strength one', (function () {
      var agent = { lv: 60, g: {}, inv: {}, cur: {}, primaryId: 'str' };
      PN.agents.equipFrom(gd, agent, dexChest.id);

    check('an empty slot takes whatever is going', (function () {

    check('gear with no primary at all suits everybody', (function () {

      return a1.g.neck === neck.id && a2.g.neck === neck.id;
