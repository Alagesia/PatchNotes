    function gearFitRun(lootMode) {
      var sd = PN.presets.build('themepark');
      sd.gearing.lootMode = lootMode;
      U.bumpDesign(sd);
      var sst = PN.state.newGame({ design: sd, seed: 17 });
      sst.phase = 'live'; sst.shipped = U.clone(sd); sst.week = 30;
      var srng = new U.Rng(4);
      var sctx = { rng: srng, world: PN.agents.buildWorldCache(sst) };
      PN.agents.admit(sst, 'raider', 40, sctx);
      sst.population.total = U.sum(sst.agents, function (a) { return a.w; });
      sst.agents.forEach(function (a) { a.lv = sd.progression.levelCap; });
      var sax = PN.sim.currentAxes(sst);
      for (var w = 0; w < 24; w++) {
        PN.agents.tickAll(sst, { rng: srng, vals: PN.axes.values(sax),
          fit: PN.axes.archetypeFit(sd, sax), balance: sax._ctx.balance,
          engines: sax._ctx.engines, lastChurnRate: 0, world: sctx.world,
          builds: sctx.world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
      }
      var right = 0, wrong = 0;
      sst.agents.forEach(function (a) {
        U.keys(a.g).forEach(function (slot) {
          var it = PN.items.itemById(sd, a.g[slot]);
          if (!it) return;
          if ((it.stats || {})[a.primaryId] > 0) right++;
          else if (sd.stats.primaries.some(function (p) {
            return p.id !== a.primaryId && (it.stats || {})[p.id] > 0; })) wrong++;
        });
      });
      return { right: right, wrong: wrong,
               pct: right + wrong > 0 ? right / (right + wrong) : 0 };
    }

    check('under group loot they at least prefer their own stat', (function () {
      window.__fitGroup = gearFitRun('group');
      return window.__fitGroup.pct > 0.7;
    })(), (function () {
      var f = window.__fitGroup || {};
      return U.round(f.pct * 100, 0) + '% of worn pieces carry their stat (' +
             f.right + ' against ' + f.wrong + ')';
    })());

    check('personal loot is smart loot and they end up properly geared', (function () {
      window.__fitPersonal = gearFitRun('personal');
      return window.__fitPersonal.pct > 0.9 &&
             window.__fitPersonal.pct > window.__fitGroup.pct;
    })(), (function () {
      var f = window.__fitPersonal || {}, g = window.__fitGroup || {};
      return U.round(f.pct * 100, 0) + '% against group loot\'s ' +
             U.round(g.pct * 100, 0) + '%';
    })());

    /* ================================================ ARMOUR TALENTS ==== */
    h('Armour talents are worth taking');
    var ad2 = PN.presets.build('themepark');
    var armId = PN.stats.statSetOf(ad2).armour.id;

      var tank = ad2.classes.filter(function (c) { return c.role === 'tank'; })[0];
      var p = PN.combat.characterProfile(ad2, tank);

             PN.combat.evaluate(ad2, tank).ehp > p.health * 1.2;
    })(), (function () {
      var tank = ad2.classes.filter(function (c) { return c.role === 'tank'; })[0];
      var p = PN.combat.characterProfile(ad2, tank);

    })());

    check('an armour talent actually moves effective health', (function () {
      var tank = ad2.classes.filter(function (c) { return c.role === 'tank'; })[0];
      var with90 = U.clone(tank);
      with90.talentStats = {}; with90.talentStats[armId] = 90;

    })(), (function () {

    check('a tank values armour over raw damage', (function () {
      var arm = { kind: 'stat', statId: armId, magnitude: 10, ranks: 3 };
      var dmg = { kind: 'passive', passiveId: 'damage', magnitude: 10, ranks: 3 };
      return PN.talents.nodeAppeal(arm, 'tank', ad2) >
             PN.talents.nodeAppeal(dmg, 'tank', ad2);
    })(), 'a thirty percent armour talent used to lose to everything');

    check('and a damage build does not', (function () {
      var arm = { kind: 'stat', statId: armId, magnitude: 10, ranks: 3 };
      var dmg = { kind: 'passive', passiveId: 'damage', magnitude: 10, ranks: 3 };

    check('a big stat talent is not called filler', (function () {
      var big = { kind: 'stat', statId: armId, magnitude: 10, ranks: 3 };
      var small = { kind: 'stat', statId: armId, magnitude: 2, ranks: 1 };
      return !PN.talents.isFiller(big) && PN.talents.isFiller(small);

    check('a tank branch really does buy its armour talent', (function () {
      var td3 = PN.presets.build('themepark');
      td3.progression.characterSystem = 'talent';
      PN.talents.generateFromClasses(td3);
      var br = PN.talents.branches(td3).filter(function (b) { return b.role === 'tank'; })[0] ||
               PN.talents.branches(td3)[0];
      br.role = 'tank';
      var node = PN.talents.addNode(td3, br.id);
      node.kind = 'stat'; node.statId = PN.stats.statSetOf(td3).armour.id;
      node.magnitude = 12; node.ranks = 3; node.cost = 1; node.tier = 1;

      U.bumpDesign(td3);
      var build = PN.talents.buildFor(td3, br);

             (build.talentStats || {})[node.statId] > 0;

    /* ============================================== BATTLE PASS ========= */
    h('A battle pass has two tracks');
    function passDesign() {
      var x = PN.presets.build('themepark');
      var freeR = PN.items.newReward({ name: 'Free tier', xp: 40 });
      var premR = PN.items.newReward({ name: 'Premium tier', xp: 40 });
      x.rewards.push(freeR); x.rewards.push(premR);
      x.monetisation.battlePass.enabled = true;
      x.monetisation.battlePass.price = 10;
      x.monetisation.battlePass.seasonWeeks = 12;
      x.monetisation.battlePass.grindHoursPerWeek = 5;
      x.monetisation.battlePass.tiers = [];
      for (var i = 1; i <= 40; i++) {
        x.monetisation.battlePass.tiers.push(
          PN.schema.newPassTier(i, { freeRewardId: freeR.id, premiumRewardId: premR.id }));
      }
      U.bumpDesign(x);
      return { d: x, free: freeR, prem: premR };
    }
    function runPass(weeks) {
      var pk = passDesign();
      var pst = PN.state.newGame({ design: pk.d, seed: 5 });
      pst.phase = 'live'; pst.shipped = U.clone(pk.d); pst.week = 0;
      PN.pop.ensureCohorts(pst); PN.economy.init(pst);
      var prng = new U.Rng(9);
      var pctx = { rng: prng, world: PN.agents.buildWorldCache(pst) };
      PN.agents.admit(pst, 'progressor', 60, pctx);
      pst.population.total = U.sum(pst.agents, function (a) { return a.w; });
      var pax = PN.sim.currentAxes(pst);
      for (var w = 0; w < weeks; w++) {
        pst.week++;
        PN.agents.tickAll(pst, { rng: prng, vals: PN.axes.values(pax),
          fit: PN.axes.archetypeFit(pk.d, pax), balance: pax._ctx.balance,
          engines: pax._ctx.engines, lastChurnRate: 0, world: pctx.world,
          builds: pctx.world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
      }
      return { st: pst, kit: pk };
    }
    var passRun = runPass(10);
    check('everybody climbs the free track', (function () {
      return passRun.st.agents.every(function (a) { return (a.passTier || 0) > 0; });
    })(), U.fmtInt(passRun.st.agents.length) + ' players, all of them earning tiers');
    check('some of them buy the pass', (function () {
      window.__passBuyers = passRun.st.agents.filter(function (a) { return a.passOwned; }).length;
      return window.__passBuyers > 0 && window.__passBuyers < passRun.st.agents.length;
    })(), (window.__passBuyers || 0) + ' bought in, the rest play the free track');
    check('paying players collect both tracks and free players only one', (function () {
      /* Same tier, twice the rewards. Run one of each by hand so the
         comparison is not muddied by how much they played. */
      var pk = passDesign();
      var pst = PN.state.newGame({ design: pk.d, seed: 2 });
      pst.week = 3;
      var rng2 = new U.Rng(1);
      function player(owned) {
        var a = { lv: 60, g: {}, inv: {}, cur: {}, xp: 0, hrs: 25, w: 1,
                  passSeason: 0, passProg: 0, passTier: 0, passOwned: owned };
        PN.agents.tickBattlePass(pst, pk.d, a, rng2);
        return { tier: a.passTier, xp: a.xp };
      }

      window.__passPair = { free: f, paid: p };
      return f.tier === p.tier && p.xp > f.xp * 1.9;
    })(), (function () {

             q.paid.xp + ' xp paid';

    check('a pass with no tiers pays out nothing', (function () {
      var pk = passDesign();

      U.bumpDesign(pk.d);
      var a = { lv: 60, g: {}, inv: {}, cur: {}, xp: 0, hrs: 40 };
      return PN.agents.tickBattlePass({ week: 1 }, pk.d, a, new U.Rng(1)) === 0;

    check('a new season starts everyone over', (function () {

    /* ============================================== CRAFTING SENSE ====== */
    h('Crafters craft what is worth having, not what sells');
    function chainDesign() {
      var x = PN.presets.build('themepark');
      var scale = PN.items.newItem({ name: 'Scale', kind: 'material', vendorValue: 10, itemLevel: 40 });
      var night = PN.items.newItem({ name: 'Nightshade', kind: 'material', vendorValue: 10, itemLevel: 40 });
      var nsc = PN.items.newItem({ name: 'Nightscale', kind: 'material', vendorValue: 20, itemLevel: 50 });
      var bis = PN.items.newItem({ name: 'Nightscale Hauberk', kind: 'gear', slot: 'chest',
        rarity: 'epic', itemLevel: 200, vendorValue: 200, stats: { str: 400, sta: 300, arm: 900 } });
      [scale, night, nsc, bis].forEach(function (i) { x.items.push(i); });
      var mk = PN.crafting.newRecipe({ name: 'Nightscale', profession: 'leatherwork',
        outputId: nsc.id, outputQty: 1, source: 'known', levelReq: 1,
        inputs: [{ itemId: scale.id, qty: 2 }, { itemId: night.id, qty: 2 }] });
      var mkBis = PN.crafting.newRecipe({ name: 'Nightscale Hauberk', profession: 'leatherwork',
        outputId: bis.id, outputQty: 1, source: 'known', levelReq: 1,
        inputs: [{ itemId: nsc.id, qty: 4 }] });
      PN.crafting.recipes(x).push(mk); PN.crafting.recipes(x).push(mkBis);
      U.bumpDesign(x);
      return { d: x, scale: scale, night: night, nsc: nsc, bis: bis, mk: mk, mkBis: mkBis };
    }
    var ch = chainDesign();

    check('an item that drops nowhere is worth more than its price', (function () {
      var cv = PN.crafting.craftValue(ch.d);
      return cv[ch.bis.id] > PN.items.itemDesire(ch.d, ch.bis) * 2;
    })(), 'the only way to hold it is to make it');

    check('a reagent inherits what it is a step towards', (function () {
      var cv = PN.crafting.craftValue(ch.d);
      window.__chain = { scale: cv[ch.scale.id], nsc: cv[ch.nsc.id], bis: cv[ch.bis.id] };
      return cv[ch.nsc.id] > PN.items.itemDesire(ch.d, ch.nsc) * 3 &&
             cv[ch.scale.id] > PN.items.itemDesire(ch.d, ch.scale) * 2;
    })(), (function () {
      var c = window.__chain || {};
      return 'Scale ' + U.round(c.scale, 0) + ', Nightscale ' + U.round(c.nsc, 0) +
             ', Hauberk ' + U.round(c.bis, 0);
    })());

    check('a player with the raw materials makes the intermediate', (function () {
      var agent = { lv: 60, inv: {}, g: {}, cur: {}, primaryId: 'str' };
      agent.inv[ch.scale.id] = 8; agent.inv[ch.night.id] = 8;
      var pick = PN.crafting.bestAvailable(ch.d, agent, PN.crafting.rankRecipes(ch.d));
      return pick && pick.id === ch.mk.id;
    })(), 'Nightscale, even though selling the reagents pays better');

    check('and then goes on to make the armour', (function () {
      var agent = { lv: 60, inv: {}, g: {}, cur: {}, primaryId: 'str' };
      agent.inv[ch.scale.id] = 8; agent.inv[ch.night.id] = 8;
      var ranked = PN.crafting.rankRecipes(ch.d);
      var made = [];
      for (var i = 0; i < 10; i++) {
        var r = PN.crafting.bestAvailable(ch.d, agent, ranked);
        if (!r) break;
        var got = PN.crafting.craft(ch.d, agent, r);
        if (!got) break;
        made.push(r.name);
        agent.inv[got.itemId] = (agent.inv[got.itemId] || 0) + got.qty;
      }
      window.__chainMade = made;
      return made.indexOf('Nightscale Hauberk') >= 0;
    })(), (window.__chainMade || []).join(' -> '));

    check('a chain step is not reported as a broken recipe', (function () {
      return !PN.crafting.recipeIssues(ch.d, ch.mk).some(function (s) {
        return /dead end|costs more/i.test(s); });
    })(), 'losing money on the way to something better is the point');

    check('but a trade good nothing consumes still is', (function () {
      var junk = PN.items.newItem({ name: 'Junk', kind: 'material', vendorValue: 1, itemLevel: 1 });
      ch.d.items.push(junk);
      var bad = PN.crafting.newRecipe({ name: 'Waste', outputId: junk.id,
        inputs: [{ itemId: ch.nsc.id, qty: 10 }] });
      U.bumpDesign(ch.d);
      return PN.crafting.recipeIssues(ch.d, bad).some(function (s) { return /dead end/i.test(s); });
    })());

    check('gear you would not wear is still judged on price', (function () {
      /* The same recipe, for somebody already in something better. */
      var agent = { lv: 60, inv: {}, g: {}, cur: {}, primaryId: 'str' };
      agent.inv[ch.nsc.id] = 4;
      agent.g.chest = ch.bis.id;      /* already wearing it */
      var appeal = PN.crafting.craftAppeal(ch.d, agent, ch.mkBis, {});

    /* ================================================== DUPLICATING ===== */
    h('Copy a thing and edit the copy');
    var dupD = PN.presets.build('themepark');

    check('an ability can be copied', (function () {

    var measured = PN.economy.measureSupply(ast);

    /* --- a real two-title week -------------------------------------- */
    var pt = PN.state.newStudio({ studio: 'Twin Peaks Interactive', year: 2016, seed: 8 });

    var a1 = PN.state.greenlight(pt, { design: PN.presets.build('themepark'), name: 'Alpha Online' });
    var a2 = PN.state.greenlight(pt, { design: PN.presets.build('arena'), name: 'Beta Arena' });
    PN.competitors.init(pt);

    /* --- being spread too thin -------------------------------------- */

    /* --- closing one down ------------------------------------------- */

    check('normalising allocation does not clobber the mounted title', (function () {

    var zonesAuthored = xd.zones.length, itemsAuthored = xd.items.length,

    var xcost = PN.patches.planCost(xst, xplan);

    check('lapsed players come back for it', xres.returned > 0,

    check('the expansion goes on sale rather than into the bank', (function () {

      return !!sale && sale.price > 0 && xres.revenue === 0;
    })(), function () { return window.__sale + ', charged to players who buy it'; }());

    check('and the players who want it are the ones who pay for it', (function () {
      /* People who have been here a while. A player in their first
         fortnight is buying the base game, not the expansion. */
      xst.agents.forEach(function (a) { a.t = Math.max(a.t || 0, 12); a.sat = 65; });
      var before = U.sum(xst.agents, function (a) { return (a.expOwned || 0) * a.w; });

    check('the game knows which activity pays the best gear in the game', (function () {

    check('and buying it off another player is only a road if you can pay', (function () {

      var victim = pfNames.slice().sort(function (a, b) {

    var lbD = PN.presets.build('themepark');

    h('A release costs something to ship');

    PN.pop.ensureCohorts(feeSt); PN.economy.init(feeSt); PN.competitors.init(feeSt);

    })(), function () { return 'cap-weeks just to ship: ' + window.__fees; }());

    /* ====================================== THE LIVE CALENDAR ==========

    h('Events you actually wrote');

    function testEvent(design, over) {
      var ev = PN.gameEvents.newEvent(over || {});
      ev.zoneIds = design.zones.slice(0, 2).map(function (z) { return z.id; });
      ev.monsterIds = (design.monsters || []).filter(function (m) {
        return ev.zoneIds.indexOf(m.zoneId) >= 0; }).slice(0, 5).map(function (m) { return m.id; });
      ev.questIds = (design.quests || []).filter(function (q) {
        return ev.zoneIds.indexOf(q.zoneId) >= 0; }).slice(0, 4).map(function (q) { return q.id; });
      ev.rewardId = (design.rewards || [])[0] ? design.rewards[0].id : null;
      PN.gameEvents.events(design).push(ev);
      U.bumpDesign(design);

    check('a yearly event runs its weeks and then stops', (function () {

      var fd = PN.presets.build('themepark');
      var fs = PN.state.newGame({ design: fd, seed: 66 });
      fs.phase = 'live'; fs.shipped = U.clone(fd);
      var cap4 = fd.progression.levelCap;
      fs.agents = [];
      /* One newcomer nobody would keep, and a roster of long-tenured
         veterans who would all outrank them. */
      fs.agents.push({ id: 1, nm: 'Watched', a: 'progressor', w: 1,
        lv: 2, t: 0, g: {}, inv: {}, cur: {} });
      for (var i = 0; i < PN.agents.MAX_AGENTS + 600; i++) {
        fs.agents.push({ id: 1000 + i, nm: 'V' + i, a: 'raider', w: 4,
          lv: cap4, t: 300 + i, g: {}, inv: {}, cur: {} });
      }
      fs.favourites = { 1: 1 };
      PN.agents.compact(fs, new U.Rng(4));
      var kept = fs.agents.some(function (a) { return a.id === 1; });
      window.__fav = kept
        ? 'the newest player on a full roster of veterans is still there'
        : 'DROPPED';
      return kept && fs.agents.length <= PN.agents.MAX_AGENTS;
    })(), function () { return window.__fav; }());

    check('but following somebody does not stop them quitting', (function () {
      var qd = PN.presets.build('themepark');
      /* A game nobody could stand to play. */
      qd.economy.sinkRate = 100; qd.progression.altFriction = 100;
      U.bumpDesign(qd);
      var qs = PN.state.newGame({ design: qd, seed: 67 });
      qs.phase = 'live'; qs.shipped = U.clone(qd); qs.week = 60;
      PN.pop.ensureCohorts(qs); PN.economy.init(qs);
      var rr4 = new U.Rng(14);
      var cx4 = { rng: rr4, world: PN.agents.buildWorldCache(qs) };
      PN.agents.admit(qs, 'progressor', 120, cx4);
      qs.agents.forEach(function (a) { a.sat = 2; a.nov = 2; });
      qs.population.total = U.sum(qs.agents, function (a) { return a.w; });
      qs.favourites = {};
      qs.agents.forEach(function (a) { qs.favourites[a.id] = 1; });
      var started = qs.agents.length;
      var ax5 = PN.sim.currentAxes(qs);
      for (var w = 0; w < 10; w++) {
        PN.agents.tickAll(qs, { rng: rr4, vals: PN.axes.values(ax5),
          fit: PN.axes.archetypeFit(qd, ax5), balance: ax5._ctx.balance,
          engines: ax5._ctx.engines, lastChurnRate: 0, world: cx4.world,
          builds: cx4.world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
      }
      var gone = started - qs.agents.length;
      var news = qs.log.filter(function (l) { return l.kind === 'player'; }).length;
      window.__quit = gone + ' of ' + started + ' followed players quit anyway, and the ' +
                      'feed carried ' + news + ' of them';
      /* Everyone who left was followed, so every departure is news. */
      return gone > 0 && news === gone && U.keys(qs.favourites).length === qs.agents.length;
    })(), function () { return window.__quit; }());

    /* ================ EXPERIENCE IN A UNIT SOMEBODY THINKS IN ========== */
    h('A levelling curve with numbers on it');

    check('the curve says what a level actually costs', (function () {
      var xd = PN.presets.build('themepark');
      var plan = PN.agents.xpPlan(xd);
      window.__curve = 'level 1 costs ' + U.fmtCompact(Math.round(plan.first)) +
                       ', the last one ' + U.fmtCompact(Math.round(plan.last)) +
                       ', ' + U.fmtCompact(Math.round(plan.total)) + ' all told';
      return plan.perLevel.length === xd.progression.levelCap - 1 &&
             plan.total > 0 && plan.last > plan.first;
    })(), function () { return window.__curve; }());

    check('and an award is priced in levels, not in nothing', (function () {
      var wd = PN.presets.build('themepark');
      var atTen = PN.agents.xpWorth(wd, PN.agents.xpForLevel(wd, 10), 10);
      var tiny = PN.agents.xpWorth(wd, 24, 10);
      window.__worth = 'a full level at ten is ' +
                       U.round(atTen.share * 100, 0) + '% of a level; ' +
                       '24 experience is ' + U.round(tiny.share * 100, 2) + '% of one, ' +
                       Math.round(tiny.perLevel) + ' of them per level';
      return U.round(atTen.share, 3) === 1 && Math.abs(atTen.perLevel - 1) < 0.001 &&
             tiny.perLevel > 100;
    })(), function () { return window.__worth; }());

    check('and the curve is priced against the quests that exist', (function () {
      var qd2 = PN.presets.build('themepark');
      var plan2 = PN.agents.xpPlan(qd2);
      window.__perQuest = plan2.quests + ' quests, so ' +
                          U.fmtCompact(Math.round(plan2.perQuest)) +
                          ' experience each carries one character to the cap';
      return plan2.quests > 0 &&
             Math.abs(plan2.perQuest * plan2.quests - plan2.total) < 1;
    })(), function () { return window.__perQuest; }());

    /* ================= ONE PLAYER, ONE NUMBER ========================= */
    h('Players you can tell apart');

    check('an id is never handed out twice', (function () {
      var idd = PN.presets.build('themepark');
      var ids = PN.state.newGame({ design: idd, seed: 70 });
      ids.phase = 'live'; ids.shipped = U.clone(idd);
      PN.pop.ensureCohorts(ids); PN.economy.init(ids);
      var cx = { rng: new U.Rng(21), world: PN.agents.buildWorldCache(ids) };
      PN.agents.admit(ids, 'progressor', 120, cx);
      /* A save is written and opened again. The counter used to be a
         variable in the agent file starting at one, so the next person
         to sign up after a reload was given a number somebody already
         had - and starring one of them starred the other. */
      var reopened = JSON.parse(JSON.stringify(ids));
      PN.agents.ensureIds(reopened);
      PN.agents.admit(reopened, 'progressor', 120,
        { rng: new U.Rng(22), world: PN.agents.buildWorldCache(reopened) });
      var seen = {}, clashes = 0;
      reopened.agents.forEach(function (a) {
        if (seen[a.id]) clashes++; seen[a.id] = 1; });
      window.__ids = reopened.agents.length + ' players after a reload and another intake, ' +
                     clashes + ' sharing a number';
      return clashes === 0 && reopened.nextAgentId > 0;
    })(), function () { return window.__ids; }());

    check('and a save that already has clashes is repaired on the way in',
      (function () {
        var bd = PN.presets.build('themepark');
        var bs = PN.state.newGame({ design: bd, seed: 71 });
        bs.phase = 'live'; bs.shipped = U.clone(bd);
        bs.agents = [];
        /* Three people under one number, which is what a save written
           before the counter was persisted actually looks like. */
        for (var i = 0; i < 9; i++) {
          bs.agents.push({ id: (i % 3) + 1, nm: 'P' + i, a: 'progressor', w: 1,
            lv: 10 + i, t: i, g: {}, inv: {}, cur: {} });
        }
        var names = bs.agents.map(function (a) { return a.nm; }).join(',');
        var fixed = PN.agents.ensureIds(bs);
        var seen = {}, clashes = 0;
        bs.agents.forEach(function (a) { if (seen[a.id]) clashes++; seen[a.id] = 1; });
        window.__repair = fixed + ' renumbered, ' + clashes + ' clashes left, ' +
                          'and everybody still here (' +
                          (bs.agents.map(function (a) { return a.nm; }).join(',') === names
                            ? 'same nine people' : 'ROSTER CHANGED') + ')';
        return clashes === 0 && bs.agents.length === 9 &&
               bs.agents.map(function (a) { return a.nm; }).join(',') === names;
      })(), function () { return window.__repair; }());

    check('so following somebody follows THEM', (function () {
      var fd2 = PN.presets.build('themepark');
      var fs2 = PN.state.newGame({ design: fd2, seed: 72 });
      fs2.phase = 'live'; fs2.shipped = U.clone(fd2);
      fs2.agents = [];
      for (var i = 0; i < 6; i++) {
        fs2.agents.push({ id: 1, nm: 'Twin' + i, a: 'progressor', w: 1,
          lv: 20, t: 40, g: {}, inv: {}, cur: {} });
      }
      PN.agents.ensureIds(fs2);
      /* Star the third one. Nobody else may answer to that number. */
      var target = fs2.agents[2];
      fs2.favourites = {}; fs2.favourites[target.id] = 1;
      var holders = fs2.agents.filter(function (a) { return fs2.favourites[a.id]; });
      window.__follow1 = holders.length + ' player' + (holders.length === 1 ? '' : 's') +
                         ' answer to the star: ' +
                         holders.map(function (a) { return a.nm; }).join(', ');
      return holders.length === 1 && holders[0] === target;
    })(), function () { return window.__follow1; }());

    /* =============== CONTAINERS SOMEBODY ACTUALLY OPENS ================ */
    h('Bags worth opening');
    /* The themepark preset ships five reagents and NO recipes at all,
       so every one of them is correctly worth nothing - which makes it
       useless for testing a crafting economy. Give it a real one: two
       recipes, because one recipe is not a profession anybody levels,
       and outputs with stats on them, because a sword made of nothing
       does not make its ore valuable either. */
    function craftingGame() {
      var d = PN.presets.build('themepark');
      var mats = (d.items || []).filter(function (i) { return i.kind === 'material'; });
      var template = (d.items || []).filter(function (i) { return i.kind === 'gear'; })
        .sort(function (a, b) { return (b.itemLevel || 0) - (a.itemLevel || 0); })[0];
      d.recipes = d.recipes || [];
      var made = [];
      ['Forged Blade', 'Forged Guard'].forEach(function (nm, n) {
        var it = PN.items.newItem({ name: nm, kind: 'gear',
          slot: n === 0 ? 'weapon' : 'chest', rarity: 'epic',
          itemLevel: template ? template.itemLevel : 60,
          stats: template ? U.clone(template.stats) : {},
          bind: 'equip', sources: {} });
        d.items.push(it); made.push(it);
        d.recipes.push(PN.crafting.newRecipe({ name: nm, profession: 'smithing',
          outputId: it.id, outputQty: 1,
          inputs: mats.slice(0, 3).map(function (m) { return { itemId: m.id, qty: 4 }; }) }));
      });
      U.bumpDesign(d);
      return { design: d, mats: mats, made: made[0] };
    }

    function bagGame() {
      var g = craftingGame();
      var d = g.design;
      var bis = (d.items || []).filter(function (i) { return i.kind === 'gear'; })
        .sort(function (a, b) { return (b.itemLevel || 0) - (a.itemLevel || 0); }).slice(0, 6);
      var tMat = { id: U.id('lt'), name: 'Reagents', rolls: 2, dropChance: 100, guaranteed: [],
        entries: g.mats.slice(0, 3).map(function (i) {
          return { itemId: i.id, weight: 1, qtyMin: 2, qtyMax: 6 }; }) };
      var tBis = { id: U.id('lt'), name: 'Endgame cache', rolls: 1, dropChance: 100, guaranteed: [],
        entries: bis.map(function (i) {
          return { itemId: i.id, weight: 1, qtyMin: 1, qtyMax: 1 }; }) };
      d.lootTables.push(tMat, tBis);
      var bagM = PN.items.newItem({ name: 'Bag of Materials', kind: 'consumable',
        effects: [{ type: 'openLoot', lootTableId: tMat.id }] });
      var bagB = PN.items.newItem({ name: 'Cache of the Deep', kind: 'consumable',
        effects: [{ type: 'openLoot', lootTableId: tBis.id }] });
      d.items.push(bagM, bagB);
      U.bumpDesign(d);
      return { design: d, bagM: bagM, bagB: bagB };
    }

    check('a bag that opens a loot table is worth what is in it', (function () {
      var g = bagGame(1);
      var pool = PN.agents.consumablesOf(g.design);
      var m = pool.filter(function (c) { return c.id === g.bagM.id; })[0];
      var b = pool.filter(function (c) { return c.id === g.bagB.id; })[0];
      window.__bags = !m || !b ? 'a bag with a loot table in it is not even listed'
        : 'reagent bag pays ' + U.round(m.byKind.materials, 1) + ' in materials, ' +
          'the cache pays ' + U.round(b.byKind.gear, 1) + ' in gear';
      /* Both are containers, and each pays out in its own kind. */
      return !!m && !!b && m.container && b.container &&
             m.byKind.materials > 0 && b.byKind.gear > 0 &&
             b.byKind.gear > b.byKind.materials;
    })(), function () { return window.__bags; }());

    check('and who wants it depends on who they are', (function () {
      function worths(archId) {
        var g = bagGame(2);
        var s = PN.state.newGame({ design: g.design, seed: 73 });
        s.phase = 'live'; s.shipped = U.clone(g.design); s.week = 90;
        PN.pop.ensureCohorts(s); PN.economy.init(s);
        var rr = new U.Rng(24);
        var cx = { rng: rr, world: PN.agents.buildWorldCache(s) };
        PN.agents.admit(s, archId, 40, cx);
        s.agents.forEach(function (a) {
          a.lv = g.design.progression.levelCap; a.sat = 65;
          a.inv = a.inv || {};
          a.inv[g.bagM.id] = 4; a.inv[g.bagB.id] = 4;
        });
        s.population.total = U.sum(s.agents, function (a) { return a.w; });
        var ax = PN.sim.currentAxes(s);
        PN.agents.tickAll(s, { rng: rr, vals: PN.axes.values(ax),
          fit: PN.axes.archetypeFit(g.design, ax), balance: ax._ctx.balance,
          engines: ax._ctx.engines, lastChurnRate: 0, world: cx.world,
          builds: cx.world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
        var pool = PN.agents.consumablesOf(g.design);
        var cM = pool.filter(function (c) { return c.id === g.bagM.id; })[0];
        var cB = pool.filter(function (c) { return c.id === g.bagB.id; })[0];
        return {
          mats: U.avg(s.agents, function (a) {
            return PN.agents.containerWorth(g.design, a, cM); }),
          gear: U.avg(s.agents, function (a) {
            return PN.agents.containerWorth(g.design, a, cB); })
        };
      }
      var eco = worths('economist'), raid = worths('raider');
      window.__who = 'an economist rates the reagent bag ' + U.round(eco.mats, 2) +
                     ' against a raider’s ' + U.round(raid.mats, 2) +
                     '; the raider rates the gear cache ' + U.round(raid.gear, 2);
      /* The crafter wants the reagents more than the raider does, and
         the raider wants the gear more than the reagents. */
      return eco.mats > raid.mats && raid.gear > raid.mats;
    })(), function () { return window.__who; }());

    check('and a bag in your bags actually gets opened', (function () {
      var g = bagGame(3);
      var s = PN.state.newGame({ design: g.design, seed: 74 });
      s.phase = 'live'; s.shipped = U.clone(g.design); s.week = 90;
      PN.pop.ensureCohorts(s); PN.economy.init(s);
      var rr = new U.Rng(25);
      var cx = { rng: rr, world: PN.agents.buildWorldCache(s) };
      PN.agents.admit(s, 'economist', 40, cx);
      s.agents.forEach(function (a) {
        a.lv = g.design.progression.levelCap; a.sat = 65;
        a.inv = {}; a.inv[g.bagM.id] = 4;
      });
      s.population.total = U.sum(s.agents, function (a) { return a.w; });
      var held = U.sum(s.agents, function (a) { return a.inv[g.bagM.id] || 0; });
      var ax = PN.sim.currentAxes(s);
      PN.agents.tickAll(s, { rng: rr, vals: PN.axes.values(ax),
        fit: PN.axes.archetypeFit(g.design, ax), balance: ax._ctx.balance,
        engines: ax._ctx.engines, lastChurnRate: 0, world: cx.world,
        builds: cx.world.builds, buildScores: {}, roleShortage: {}, goldSunk: 0 });
      var left = U.sum(s.agents, function (a) { return a.inv[g.bagM.id] || 0; });
      /* And the reagents that were inside them are now in bags. */
      var reagents = 0;
      (g.design.items || []).forEach(function (i) {
        if (i.kind !== 'material') return;
        reagents += U.sum(s.agents, function (a) { return (a.inv || {})[i.id] || 0; });
      });
      window.__opened = (held - left) + ' of ' + held + ' bags opened in one week, ' +
                        U.fmtInt(reagents) + ' reagents in bags afterwards';
      return left < held && reagents > 0;
    })(), function () { return window.__opened; }());

    /* ==================== A MARKET, NOT A TYPED NUMBER ================= */
    h('What a thing is worth');

    check('a vendor-sold item is worth what the vendor charges', (function () {
      var md = PN.presets.build('themepark');
      var sold = null;
      (md.items || []).forEach(function (i) {
        if (!sold && PN.items.isVendorable(i) && i.kind !== 'gear') sold = i; });
      if (!sold) {
        sold = PN.items.newItem({ name: 'Shop Trinket', kind: 'material',
          vendorValue: 42, sources: { vendor: true } });
        md.items.push(sold);
      } else { sold.vendorValue = 42; }
      U.bumpDesign(md);
      var p = PN.market.priceOf(md, sold);
      window.__vendor = sold.name + ' is on a shelf at ' + sold.vendorValue +
                        ', and the market says ' + p.price +
                        (p.vendorLocked ? ' (locked)' : ' (FLOATING)');
      return p.vendorLocked && p.price === 42;
    })(), function () { return window.__vendor; }());

    check('and everything else is wanted against how much of it arrives',
      (function () {
        /* Same reagent, same recipe eating it, two different worlds:
           one where it is thick on the ground and one where it is not.
           Demand held still, so the only thing moving is supply. */
        function priceAt(density) {
          var g = craftingGame();
          var mat = g.mats[0];
          mat.sources = { gather: true };
          g.design.economy.gatheringNodes = density;
          U.bumpDesign(g.design);
          return { name: mat.name, p: PN.market.priceOf(g.design, mat) };
        }
        var thin = priceAt(2), thick = priceAt(100);
        window.__supply = thin.name + ': ' + thin.p.price + ' when it is rare, ' +
                          thick.p.price + ' when it is everywhere (scarcity ' +
                          U.round(thin.p.scarcity, 2) + ' against ' +
                          U.round(thick.p.scarcity, 2) + ')';
        return thin.p.price > thick.p.price && thin.p.scarcity > thick.p.scarcity &&
               thick.p.price > 0;
      })(), function () { return window.__supply; }());

    check('a reagent no recipe eats is worth nothing, however much there is',
      (function () {
        var nd = PN.presets.build('themepark');
        var idle = PN.items.newItem({ name: 'Useless Grit', kind: 'material',
          sources: { gather: true } });
        nd.items.push(idle);
        U.bumpDesign(nd);
        var p = PN.market.priceOf(nd, idle);
        var flagged = PN.market.issues(nd).filter(function (s) {
          return s.indexOf('no recipe uses') >= 0; }).length > 0;
        window.__idle = 'Useless Grit is worth ' + p.price + ' and the market ' +
                        (flagged ? 'says which reagents nothing uses' : 'says NOTHING about it');
        return p.price <= 0.1 && flagged;
      })(), function () { return window.__idle; }());

    check('and best-in-slot outsells the reagents it is made from', (function () {
      var g2 = craftingGame();
      var bd2 = g2.design;
      /* Let gear trade at all, or the shelf has no gear on it. */
      (bd2.items || []).forEach(function (i) {
        if (i.kind === 'gear') { i.bind = 'equip'; i.sources = { drop: true }; } });
      g2.mats.forEach(function (m) { m.sources = { gather: true }; });
      if (bd2.gearing) bd2.gearing.tradeable = true;
      U.bumpDesign(bd2);
      var rows = PN.market.listing(bd2);
      var topGear = rows.filter(function (r) { return r.item.kind === 'gear'; })[0];
      var topMat = rows.filter(function (r) { return r.item.kind === 'material'; })[0];
      if (!topGear || !topMat) { window.__bis = 'nothing tradeable to compare'; return false; }
      window.__bis = topGear.item.name + ' at ' + Math.round(topGear.price) +
                     ' against ' + topMat.item.name + ' at ' + Math.round(topMat.price) +
                     ' - the sword is worth more than the ore in it';
      return topGear.price > topMat.price && topMat.price > 0;
    })(), function () { return window.__bis; }());

    /* ================ EXPERIENCE PRICED LIKE EVERYTHING ELSE ========== */
    h('A reward you can compare with another reward');

    check('experience is priced in levels, not in a flat multiplier', (function () {
      var xd2 = PN.presets.build('themepark');
      var r = PN.items.newReward({ name: 'Probe' });
      xd2.rewards.push(r);
      xd2.quests.push({ id: 'q_probe', name: 'Probe', level: 10,
        rewardId: r.id, repeatable: 'none' });
      U.bumpDesign(xd2);
      var one = PN.agents.xpForLevel(xd2, 10);
      function at(xp) { r.xp = xp; U.bumpDesign(xd2); return PN.items.rewardValue(xd2, r); }
      var tenth = at(Math.round(one * 0.1));
      var full = at(Math.round(one));
      var absurd = at(Math.round(one * 40));
      window.__xpv = 'a tenth of a level scores ' + U.round(tenth, 0) +
                     ', a whole level ' + U.round(full, 0) +
                     ', forty levels ' + U.round(absurd, 0) + ' (it saturates)';
      /* Ten times the experience is worth roughly ten times as much,
         and nothing runs away to infinity. */
      return full > tenth * 4 && absurd < full * 6;
    })(), function () { return window.__xpv; }());

    check('so a bundle of best-in-slot beats a handful of experience', (function () {
      var cd5 = PN.presets.build('themepark');
      var top = (cd5.items || []).filter(function (i) { return i.kind === 'gear'; })
        .sort(function (a, b) { return (b.itemLevel || 0) - (a.itemLevel || 0); }).slice(0, 6);
      var gearR = PN.items.newReward({ name: 'Raid bundle',
        items: top.map(function (i) { return { itemId: i.id, qty: 1, chance: 0.2 }; }) });
      var xpR = PN.items.newReward({ name: 'A bit of experience' });
      cd5.rewards.push(gearR, xpR);
      cd5.quests.push({ id: 'q_x', name: 'Endgame quest',
        level: cd5.progression.levelCap - 1, rewardId: xpR.id, repeatable: 'none' });
      /* A tenth of a level, which is what ten thousand experience is
         worth at the cap - and which used to score a hundred and
         twenty against the raid bundle's thirteen. */
      xpR.xp = Math.round(PN.agents.xpForLevel(cd5, cd5.progression.levelCap - 1) * 0.1);
      U.bumpDesign(cd5);
      var gv = PN.items.rewardValue(cd5, gearR), xv = PN.items.rewardValue(cd5, xpR);
      window.__cmp = 'raid bundle ' + Math.round(gv) + ', a tenth of a level ' +
                     Math.round(xv);
      return gv > xv;
    })(), function () { return window.__cmp; }());

    /* ================ ZONES THAT SHARE THEIR PEOPLE =================== */
    h('Two zones at the same level, and people in both');

    check('a second max-level zone does not empty the first', (function () {
      var zd = PN.presets.build('themepark');
      var cap = zd.progression.levelCap;
      /* Two zones in the same band, as an expansion beside the one
         before it. */
      var a = PN.schema.newZone('Old Expansion',
        { levelLo: cap, levelHi: cap, size: 60, artBudget: 60 });
      var b = PN.schema.newZone('New Expansion',
        { levelLo: cap, levelHi: cap, size: 60, artBudget: 60 });
      zd.zones.push(a, b);
      /* Something to do in each, or neither is a draw. */
      [a, b].forEach(function (z, i) {
        for (var q = 0; q < 6; q++) {
          zd.quests.push({ id: U.id('qst'), name: 'Q' + i + q, level: cap,
            zoneId: z.id, rewardId: null, repeatable: 'none' });
        }
      });
      U.bumpDesign(zd);
      var zs = PN.state.newGame({ design: zd, seed: 80 });
      zs.phase = 'live'; zs.shipped = U.clone(zd); zs.week = 120;

      PN.diff.lines(diff).forEach(function (g) {
        g.items.forEach(function (t) { if (t.indexOf(text) >= 0) hit = true; }); });
      return hit;
    }

    check('planning a second release does not copy the first one’s list',
      (function () {
        var g = twoPlanGame();
        var d2 = PN.patches.planDiff(g.state, g.two);
        window.__noCopy = 'the second release lists its own quest: ' +
          mentions(d2, 'For the second one') + ', and the first one’s: ' +
          mentions(d2, 'For the first one');
        return mentions(d2, 'For the second one') && !mentions(d2, 'For the first one');
      })(), function () { return window.__noCopy; }());

    check('and its notes are about it, not about the one before', (function () {
      var g = twoPlanGame();
      var notes = PN.patches.autoNotes(g.state, g.two);
      window.__noteLeak = notes.indexOf('For the first one') >= 0
        ? 'the second release’s notes describe the first one'
        : 'each release writes its own notes';
      return notes.indexOf('For the second one') >= 0 &&
             notes.indexOf('For the first one') < 0;
    })(), function () { return window.__noteLeak; }());

    check('but shipping it still carries what came before', (function () {
      var g = twoPlanGame();
      PN.sim.shipPlan(g.state, g.two, { force: true });
      var names = (g.state.shipped.quests || []).map(function (q) { return q.name; });
      window.__carries = 'players got: ' +
        names.filter(function (n) { return n.indexOf('For the') === 0; }).join(' and ');
      /* A release cannot ship without what came before it, however the
         roadmap describes each card. */
      return names.indexOf('For the first one') >= 0 &&
             names.indexOf('For the second one') >= 0;
    })(), function () { return window.__carries; }());

    /* ========== THREE RELEASES, THREE SETS OF CHANGES ================= */
    h('A change belongs to the release you were looking at');

    /* Four things have to be true at once, and for three passes none of
       them were. A release used to be "everything authored since the
       last one", with newly created OBJECTS tagged with a plan id -
       which covered adding a quest and covered nothing else. Every
       slider, every retuned loot table and every renamed boss belonged
       to no release at all and went out with whichever shipped first,
       and the work was banked in one pool every release read from, so
       building the first one showed as progress on the third.

       A release holds a DELTA now: the difference between the game
       after everything planned before it and the game after it. Every
       kind of edit is the same kind of thing to a delta. */

    function boardGame(seed) {
      var d = PN.presets.build('themepark');
      var s = PN.state.newGame({ design: d, seed: seed || 31 });
      s.phase = 'live'; s.shipped = U.clone(d); s.week = 100;
      s.version = { major: 1, minor: 0, patch: 0 };
      s.patchPlan = [];
      s.progress = { design: 0, art: 0, eng: 0, qa: 0 };
      PN.pop.ensureCohorts(s);
      return s;
    }
    function board(s, weeks) {
      return weeks.map(function (w) {
        var pl = PN.patches.newPlan({ kind: 'patch', targetWeek: s.week + w });
        s.patchPlan.push(pl);
        return pl;
      });
    }

    check('a slider lands on the release you had selected, and on no other',
      (function () {
        var s = boardGame();
        var pl = board(s, [4, 16]);
        author(s, pl[1], function (d) { d.economy.faucetRate = 70; });
        window.__oneRelease = 'the selected release changed ' +
          U.keys(pl[1].delta.set).join(', ') + '; the other changed ' +
          (PN.patches.deltaEmpty(pl[0].delta) ? 'nothing' :
           U.keys(pl[0].delta.set).join(', '));
        return pl[1].delta.set['economy.faucetRate'] === 70 &&
               PN.patches.deltaEmpty(pl[0].delta) &&
               s.shipped.economy.faucetRate !== 70;
      })(), function () { return window.__oneRelease; }());

    check('an earlier release is already in force in a later one, so typing ' +
          'its value again does nothing',
      (function () {
        var s = boardGame();
        s.design.economy.faucetRate = 65; s.shipped.economy.faucetRate = 65;
        var pl = board(s, [4, 12]);
        author(s, pl[0], function (d) { d.economy.faucetRate = 70; });
        PN.patches.mountPlan(s, pl[1].id);
        var opensAt = s.design.economy.faucetRate;
        author(s, pl[1], function (d) { d.economy.faucetRate = 70; });
        var typing70 = PN.patches.deltaEmpty(pl[1].delta);
        window.__inForce = 'the later release opens at ' + opensAt +
          ' because the earlier one set it, and typing 70 into it records ' +
          (typing70 ? 'nothing' : U.keys(pl[1].delta.set).join(', '));
        return opensAt === 70 && typing70;
      })(), function () { return window.__inForce; }());

    check('and typing the OLD value back into it is a real revert', (function () {
      var s = boardGame();
      s.design.economy.faucetRate = 65; s.shipped.economy.faucetRate = 65;
      var pl = board(s, [4, 12]);
      author(s, pl[0], function (d) { d.economy.faucetRate = 70; });
      author(s, pl[1], function (d) { d.economy.faucetRate = 65; });
      var ends = PN.patches.finalDesign(s).economy.faucetRate;
      window.__revert = 'the first release sets it to ' +
        pl[0].delta.set['economy.faucetRate'] + ', the second puts it back to ' +
        pl[1].delta.set['economy.faucetRate'] + ', and the roadmap played out ends at ' + ends;
      return pl[0].delta.set['economy.faucetRate'] === 70 &&
             pl[1].delta.set['economy.faucetRate'] === 65 && ends === 65;
    })(), function () { return window.__revert; }());

    check('retuning a loot table is written to the selected release like ' +
          'anything else',
      (function () {
        /* The case the tagging model could never cover: nothing new was
           created, so there was nothing to tag. Loot entries have no
           ids either, so recording the whole table would have made any
           other release's change to any other row disappear. */
        var s = boardGame();
        var pl = board(s, [4, 12]);
        var was = s.shipped.lootTables[0].entries[0].chance;
        var other = s.shipped.lootTables[0].entries[1];
        author(s, pl[1], function (d) { d.lootTables[0].entries[0].chance = 3.5; });
        author(s, pl[0], function (d) { d.lootTables[0].entries[1].chance = 9.5; });
        var path = U.keys(pl[1].delta.set)[0] || '';
        var out = PN.patches.finalDesign(s).lootTables[0].entries;
        window.__loot = 'the later release recorded ' + path +
          ', and with both applied the two rows read ' + out[0].chance + ' and ' +
          out[1].chance + ' (they were ' + was + ' and ' + other.chance + ')';
        return path.indexOf('lootTables') === 0 && path.indexOf('.chance') > 0 &&
               out[0].chance === 3.5 && out[1].chance === 9.5;
      })(), function () { return window.__loot; }());

    check('with no release selected, changing anything plans one at the BACK ' +
          'of the queue',
      (function () {
        var s = boardGame();
        var pl = board(s, [4, 40]);
        PN.patches.mountPlan(s, null);
        var showsWholeRoadmap = s.design.stats.critBonus ===
          PN.patches.finalDesign(s).stats.critBonus;
        var made = author(s, null, function (d) { d.stats.critBonus = 222; });
        var order = PN.patches.plansInOrder(s);
        window.__backOfQueue = 'the roadmap is now ' + order.length +
          ' long and the new release is ' +
          (order[order.length - 1] === made ? 'at the back' :
           order[0] === made ? 'at the FRONT' : 'somewhere in the middle') +
          ', carrying ' + U.keys(made.delta.set).join(', ');
        return showsWholeRoadmap && order.length === 3 &&
               order[order.length - 1] === made &&
               made.delta.set['stats.critBonus'] === 222 &&
               PN.patches.deltaEmpty(pl[0].delta) && PN.patches.deltaEmpty(pl[1].delta);
      })(), function () { return window.__backOfQueue; }());

    check('work is banked per release, so building one is not progress on another',
      (function () {
        var s = boardGame();
        var pl = board(s, [4, 16]);
        author(s, pl[0], function (d) {
          d.zones.push(U.merge(U.clone(d.zones[0]), { id: 'z_a', name: 'First Vale' })); });
        author(s, pl[1], function (d) {
          d.zones.push(U.merge(U.clone(d.zones[0]), { id: 'z_b', name: 'Second Vale' })); });
        for (var i = 0; i < 3; i++) {
          PN.patches.creditWork(s, { design: 6, art: 6, eng: 6, qa: 6 });
        }
        var front = PN.patches.funded(s, pl[0]), behind = PN.patches.funded(s, pl[1]);
        window.__perPlan = 'the release being built is ' + Math.round(front * 100) +
          '% built and the one behind it ' + Math.round(behind * 100) + '%';
        return front > behind;
      })(), function () { return window.__perPlan; }());

    check('shipping one release leaves every other release alone', (function () {
      var s = boardGame();
      s.design.economy.faucetRate = 65; s.shipped.economy.faucetRate = 65;
      var pl = board(s, [1, 12]);
      author(s, pl[0], function (d) { d.economy.faucetRate = 70; });
      author(s, pl[1], function (d) { d.economy.sinkRate = 44; });
      var kept = JSON.stringify(pl[1].delta);
      PN.sim.shipPlan(s, pl[0], { force: true });
      window.__shipOne = 'players got faucets ' + s.shipped.economy.faucetRate +
        ' and sinks ' + s.shipped.economy.sinkRate + '; the release still on the ' +
        'board ' + (JSON.stringify(pl[1].delta) === kept ? 'kept its own change'
                                                        : 'LOST its change') +
        ' and the draft reads ' + s.design.economy.faucetRate + '/' +
        s.design.economy.sinkRate;
      return s.shipped.economy.faucetRate === 70 && s.shipped.economy.sinkRate !== 44 &&
             JSON.stringify(pl[1].delta) === kept &&
             s.design.economy.faucetRate === 70 && s.design.economy.sinkRate === 44;
    })(), function () { return window.__shipOne; }());

    check('and a game saved before any of this keeps everything it had',
      (function () {
        /* What an old save looks like: one pool on the title, a
           roadmap, and every change sitting loose in the draft. */
        var s = boardGame();
        var pl = board(s, [6, 20]);
        s.design.economy.faucetRate = 71;
        s.design.stats.critBonus = 180;
        U.bumpDesign(s.design);
        s.progress = { design: 40, art: 30, eng: 20, qa: 10 };
        pl.forEach(function (p) { delete p.delta; delete p.progress; });

        var wanted = JSON.stringify(PN.patches.deltaBetween(s.shipped, s.design));
        PN.patches.adopt(s, s.week);
        var front = PN.patches.progressOf(s, pl[0]);
        var ends = PN.patches.finalDesign(s);
        window.__adopt = 'the front release took over ' + U.round(front.design, 0) +
          ' design of banked work, the title pool now reads ' + s.progress.design +
          ', and the roadmap played out still has faucets at ' +
          ends.economy.faucetRate + ' and crit at ' + ends.stats.critBonus;
        return JSON.stringify(pl[0].delta) === wanted &&
               PN.patches.deltaEmpty(pl[1].delta) &&
               front.design === 40 && s.progress.design === 0 &&
               ends.economy.faucetRate === 71 && ends.stats.critBonus === 180;
      })(), function () { return window.__adopt; }());

    check('cancelling a release cancels what it changed, and nothing else',
      (function () {
        var s = boardGame();
        var pl = board(s, [4, 12]);
        author(s, pl[0], function (d) { d.economy.faucetRate = 70; });
        author(s, pl[1], function (d) { d.economy.sinkRate = 44; });
        U.removeById(s.patchPlan, pl[1].id);
        PN.patches.bumpRoadmap();
        var ends = PN.patches.finalDesign(s);
        window.__cancel = 'after cancelling the second release the roadmap ends ' +
          'with faucets ' + ends.economy.faucetRate + ' and sinks ' + ends.economy.sinkRate;
        return ends.economy.faucetRate === 70 && ends.economy.sinkRate !== 44;
      })(), function () { return window.__cancel; }());

    /* ======================= BAGS ARE THE INVENTORY =================== */
    h('Somewhere to put things');

    function bagDesign(backpack) {
      var d = PN.presets.build('themepark');
      d.gearing.backpackSlots = backpack;
      var small = PN.items.newItem({ name: 'Satchel', kind: 'container',
        slots: 6, maxCarried: 2 });
      var big = PN.items.newItem({ name: 'Pack', kind: 'container',
        slots: 12, maxCarried: 3 });
      d.items.push(small, big);
      U.bumpDesign(d);
      return { design: d, small: small, big: big };
    }

    check('carrying space is the sum of the bags you own', (function () {
      var g = bagDesign(4);
      var a = { id: 1, g: {}, inv: {}, bags: {}, cur: {} };
      var alone = PN.agents.slotsOf(g.design, a);
      PN.agents.addItem(g.design, a, g.small.id, 9);     /* only two allowed */
      var withSmall = PN.agents.slotsOf(g.design, a);
      PN.agents.addItem(g.design, a, g.big.id, 9);       /* only three */
      var withBoth = PN.agents.slotsOf(g.design, a);
      window.__slots = alone + ' from the backpack, ' + withSmall +
                       ' with two satchels, ' + withBoth + ' with three packs as well';
      /* 4 + 2x6 = 16, then + 3x12 = 52. The carry limits hold. */
      return alone === 4 && withSmall === 16 && withBoth === 52;
    })(), function () { return window.__slots; }());

    check('a stack is one slot however many are in it', (function () {
      var g = bagDesign(3);
      var a = { id: 2, g: {}, inv: {}, bags: {}, cur: {} };
      var mats = (g.design.items || []).filter(function (i) { return i.kind === 'material'; });
      /* Forty of one reagent is one slot; one each of four is four. */
      PN.agents.addItem(g.design, a, mats[0].id, 40);
      var oneKind = U.keys(a.inv).length;
      mats.slice(1, 4).forEach(function (m) {
        PN.agents.addItem(g.design, a, m.id, 1); });
      window.__stacks = 'forty of one reagent is ' + oneKind + ' slot, ' +
                        'four kinds is ' + U.keys(a.inv).length;
      return oneKind === 1 && U.keys(a.inv).length === 3 &&
             a.inv[mats[0].id] === 40;
    })(), function () { return window.__stacks; }());

    check('with no bags nothing is kept - but gear still goes on', (function () {
      var g = bagDesign(0);
      var a = { id: 3, g: {}, inv: {}, bags: {}, cur: {}, lv: 60 };
      var mats = (g.design.items || []).filter(function (i) { return i.kind === 'material'; });
      mats.forEach(function (m) { PN.agents.addItem(g.design, a, m.id, 5); });
      var gear = (g.design.items || []).filter(function (i) { return i.kind === 'gear'; })
        .sort(function (x, y) { return (y.itemLevel || 0) - (x.itemLevel || 0); }).slice(0, 5);
      gear.forEach(function (it) { PN.agents.addItem(g.design, a, it.id, 1); });
      window.__noBags = PN.agents.slotsOf(g.design, a) + ' slots, ' +
                        U.keys(a.inv).length + ' stacks kept, ' +
                        U.keys(a.g).length + ' pieces worn';
      return PN.agents.slotsOf(g.design, a) === 0 &&
             U.keys(a.inv).length === 0 && U.keys(a.g).length > 0;
    })(), function () { return window.__noBags; }());

    check('and a full bag keeps the better thing', (function () {
      var g = bagDesign(2);
      var a = { id: 4, g: {}, inv: {}, bags: {}, cur: {} };
      /* Three reagents worth visibly different amounts. The preset's
         own reagents are all worth nothing - no recipe eats them - and
         a bag correctly does not swap one worthless thing for another,
         so the test has to price them to have a question to ask. */
      var cheap = PN.items.newItem({ name: 'Dust', kind: 'material',
        vendorValue: 2, sources: { vendor: true } });
      var mid = PN.items.newItem({ name: 'Shard', kind: 'material',
        vendorValue: 30, sources: { vendor: true } });
      var rich = PN.items.newItem({ name: 'Star Ruby', kind: 'material',
        vendorValue: 400, sources: { vendor: true } });
      g.design.items.push(cheap, mid, rich);
      U.bumpDesign(g.design);
      PN.agents.addItem(g.design, a, cheap.id, 1);
      PN.agents.addItem(g.design, a, mid.id, 1);
      /* Two slots, both full. The ruby is worth more than the dust. */
      PN.agents.addItem(g.design, a, rich.id, 1);
      window.__full = U.keys(a.inv).length + ' slots used; kept the ruby: ' +
                      (a.inv[rich.id] > 0) + ', dropped the dust: ' + !a.inv[cheap.id];
      return U.keys(a.inv).length === 2 && a.inv[rich.id] > 0 && !a.inv[cheap.id];
    })(), function () { return window.__full; }());

    check('a bag is worth the room it gives', (function () {
      var g = bagDesign(0);
      var small = PN.market.priceOf(g.design, g.small).price;
      var big = PN.market.priceOf(g.design, g.big).price;
      window.__bagWorth = 'a six-slot satchel ' + Math.round(small) +
                          ', a twelve-slot pack ' + Math.round(big);
      return big > small && small > 0;
    })(), function () { return window.__bagWorth; }());

    /* ================= REAGENTS THAT ARE NOT ALWAYS ORE =============== */
    h('Recipes that ask for anything');

    check('a recipe can eat gold, gear or a flask', (function () {
      var cd7 = PN.presets.build('themepark');
      var gold = (cd7.items || []).filter(function (i) { return i.kind === 'currency'; })[0];
      var worn = (cd7.items || []).filter(function (i) { return i.kind === 'gear'; })[0];
      var flask = (cd7.items || []).filter(function (i) { return i.kind === 'consumable'; })[0];
      var out = (cd7.items || []).filter(function (i) { return i.kind === 'gear'; })[1];
      if (!gold || !worn || !flask || !out) { window.__reagents = 'preset too thin'; return true; }
      var r = PN.crafting.newRecipe({ name: 'Reforged Blade', profession: 'smithing',
        outputId: out.id, outputQty: 1,
        inputs: [{ itemId: gold.id, qty: 500 }, { itemId: worn.id, qty: 1 },
                 { itemId: flask.id, qty: 2 }] });
      cd7.recipes.push(r);
      U.bumpDesign(cd7);
      var m = PN.crafting.recipeMetrics(cd7, r);
      var agent = { lv: 60, inv: {} };
      agent.inv[gold.id] = 500; agent.inv[worn.id] = 1; agent.inv[flask.id] = 2;
      var made = PN.crafting.craft(cd7, agent, r);
      window.__reagents = 'reagents cost ' + Math.round(m.inValue) +
                          ', and the craft ' + (made ? 'went through' : 'FAILED') +
                          ' spending ' + (500 - (agent.inv[gold.id] || 0)) + ' gold';
      /* Every kind counted, and every kind actually spent. */
      return m.missing.length === 0 && !!made &&
             !agent.inv[worn.id] && (agent.inv[gold.id] || 0) === 0;
    })(), function () { return window.__reagents; }());

    check('and a recipe can be gated on a quest item you carry', (function () {
      var qd3 = PN.presets.build('themepark');
      var token = PN.items.newItem({ name: 'Sigil of the Order', kind: 'questItem' });
      var out2 = (qd3.items || []).filter(function (i) { return i.kind === 'gear'; })[0];
      qd3.items.push(token);
      var r2 = PN.crafting.newRecipe({ name: 'Order Blade', profession: 'smithing',
        outputId: out2.id, source: 'quest', questItemId: token.id,
        inputs: [{ itemId: token.id, qty: 0 }] });
      qd3.recipes.push(r2);
      U.bumpDesign(qd3);
      var without = PN.crafting.knows({ inv: {} }, r2);
      var carrying = {};
      carrying[token.id] = 1;
      var with_ = PN.crafting.knows({ inv: carrying }, r2);
      /* And "both" wants the page as well. */
      r2.source = 'both'; r2.recipeItemId = null;
      var bothUnset = PN.crafting.knows({ inv: carrying }, r2);
      window.__questGate = 'without the sigil: ' + without + ', carrying it: ' + with_ +
                           ', and with both gates but no recipe page: ' + bothUnset;
      return !without && with_ && !bothUnset;
    })(), function () { return window.__questGate; }());

    check('and the four ways to gate a recipe all say what they mean',
      (function () {
        var mute = PN.crafting.SOURCES.filter(function (s) {
          return !s.desc || s.needsRecipe === undefined || s.needsQuest === undefined; });
        window.__gates = PN.crafting.SOURCES.map(function (s) { return s.name; }).join(' / ');
        return PN.crafting.SOURCES.length === 4 && mute.length === 0;
      })(), function () { return window.__gates; }());

    /* ============ A BAG IS CARRIED, NOT USED ========================== */
    h('Bags are not consumables');

    function bagWorld(backpack) {
      var d = PN.presets.build('themepark');
      d.gearing.backpackSlots = backpack;
      (d.items || []).forEach(function (i) {
        if (i.kind === 'container') i.sources = { vendor: i.id === 'bag_starter' };
      });
      U.bumpDesign(d);
      return d;
    }

    check('a bag is never offered as something to use up', (function () {
      var d = bagWorld(0);
      /* Even one carrying leftover effects from when a container
         opened a loot table. */
      var legacy = PN.items.newItem({ name: 'Legacy Cache', kind: 'container',
        slots: 4, maxCarried: 2 });
      legacy.effects = [{ type: 'openLoot', lootTableId: (d.lootTables[0] || {}).id }];
      d.items.push(legacy);
      U.bumpDesign(d);
      var pool = PN.agents.consumablesOf(d);
      var bags = pool.filter(function (c) { return c.item.kind === 'container'; });
      window.__bagCons = bags.length
        ? bags.length + ' bag(s) listed as consumable'
        : 'no bag is listed as something to drink or open';
      return bags.length === 0;
    })(), function () { return window.__bagCons; }());

    check('and carrying one never uses it up', (function () {
      var d = bagWorld(0);
      var a = { id: 70, seed: 70, g: {}, inv: {}, bags: {}, cur: {}, lv: 50,
                a: 'progressor', w: 1,
                __wants: { gear: 1, materials: 1, currency: 1, cosmetic: 1 } };
      PN.agents.addItem(d, a, 'bag_starter', 4);
      var before = a.bags.bag_starter;
      PN.agents.openBags(d, a, new U.Rng(3));
      PN.agents.drinkUp(d, a, 10, 1.5);
      window.__bagKeep = before + ' bags before a week of drinking and opening, ' +
                         (a.bags.bag_starter || 0) + ' after; ' +
                         U.keys(a.inv).length + ' of them in the inventory';
      /* A bag is not IN your bags - it IS your bags. */
      return a.bags.bag_starter === before && !a.inv.bag_starter;
    })(), function () { return window.__bagKeep; }());

    /* ================ PLAYERS GO AND GET BAGS ========================= */
    h('Room in your bags is worth chasing');

    check('somebody who can afford a bag buys one', (function () {
      var d = bagWorld(0);
      var gold = PN.currency.moneyOf(d);
      function tryWith(money) {
        var a = { id: 71, seed: 71, g: {}, inv: {}, bags: {}, cur: {}, lv: 50,
                  a: 'progressor', w: 1 };
        a.cur[gold.id] = money;
        var spent = PN.agents.buyBags(d, a);
        return { slots: PN.agents.slotsOf(d, a), spent: spent,
                 left: a.cur[gold.id] || 0 };
      }
      var rich = tryWith(5000), skint = tryWith(5);
      window.__buy = 'with 5,000 gold: ' + rich.slots + ' slots for ' + rich.spent +
                     '; with 5: ' + skint.slots + ' slots';
      /* Bought up to the carry limit, paid for it, and somebody with
         nothing stays with nothing. */
      return rich.slots > 0 && rich.spent > 0 &&
             rich.left === 5000 - rich.spent && skint.slots === 0;
    })(), function () { return window.__buy; }());

    check('and stops at the limit you set', (function () {
      var d = bagWorld(0);
      var gold = PN.currency.moneyOf(d);
      var starter = PN.items.itemById(d, 'bag_starter');
      var a = { id: 72, seed: 72, g: {}, inv: {}, bags: {}, cur: {}, lv: 50,
                a: 'progressor', w: 1 };

    /* ============ EVERY DECADE IS A DIFFERENT GAME =================== */
    h('An era is a different game, not a different caption');

    /* The era table used to carry a market size, three tolerances and a
       note. Everything else about "it is 1999" was flavour text: the
       same design, the same rivals, the same everything. */

    function eraGame(year, tweak) {
      var d = PN.presets.build('themepark');
      d.meta.startYear = year;
      if (tweak) tweak(d);
      U.bumpDesign(d);
      var s = PN.state.newGame({ design: d, seed: 5 });
      s.startYear = year; s.era = PN.tax.eraForYear(year);
      s.phase = 'live'; s.shipped = U.clone(d);
      s.runtime.awareness = 100; s.runtime.sentiment = 62; s.runtime.reviewScore = 72;
      PN.pop.ensureCohorts(s); PN.economy.init(s);
      return s;
    }
    function intakeOf(s) {
      var ax = PN.sim.currentAxes(s);
      return PN.pop.acquire(s, PN.axes.archetypeFit(s.design, ax, s.era),
                            ax._ctx.coherence).total;
    }
    function eraByName(n) {
      var out = null;
      PN.tax.ERAS.forEach(function (e) { if (e.name === n) out = e; });
      return out;
    }

    check('the market is smallest at the start and biggest at the peak',
      (function () {
        var sizes = PN.tax.ERAS.map(function (e) { return PN.tax.marketPool(e); });
        window.__eraMarket = PN.tax.ERAS.map(function (e, i) {
          return e.name.split(' ').pop() + ' ' + U.fmtCompact(sizes[i]); }).join(', ');
        /* The Frontier is a tenth of the Themepark Wars, the Gold Rush
           about half of it, and the Attention Economy twice it. */
        var frontier = sizes[0], gold = sizes[1], park = sizes[2], tail = sizes[3],
            att = sizes[4];
        return frontier < park * 0.15 && gold > park * 0.4 && gold < park * 0.6 &&
               Math.abs(tail - park) < 1 && att > park * 1.8;
      })(), function () { return window.__eraMarket; }());

    check('nobody else is making an MMO in 1999, and somebody is from 2004 on',
      (function () {

        window.__eraRivals = PN.tax.ERAS.map(function (e, i) {
          return e.year + ': ' + counts[i]; }).join(', ');
        return counts[0] === 0 && counts.slice(1).every(function (n) { return n > 0; });
      })(), function () { return window.__eraRivals; }());

    check('a badly built game costs you almost nothing in 1999 and a great deal later',

    /* ================== A SECOND BAG IS MORE ROOM ==================== */
    h('A second bag is more room, even if it is no bigger');

    /* ============= A MARKET WITH SOMEBODY ELSE IN IT ================= */
    h('Rivals who can win');

    /* Every rival used to die. They ran on a MOMENTUM that was added to
       when they shipped content and subtracted from every week in
       between, and the subtraction across an eighteen-to-forty-four
       week cadence came to four to six times the addition - so momentum
       pinned itself to its floor of -12% a week and stayed there.
       Every rival decayed to nothing in about twenty-five weeks and
       quality bought three of them. An eighty-nine-rated game was as
       doomed as a forty. A world of rivals was a graveyard. */

    function rivalWorld(seed) {
      var d = PN.presets.build('themepark');
      var s = PN.state.newGame({ design: d, seed: seed || 77 });
      s.phase = 'live'; s.shipped = U.clone(d); s.week = 200;
      s.runtime.reviewScore = 72; s.runtime.sentiment = 64;
      PN.pop.ensureCohorts(s); PN.economy.init(s);
      return s;
    }
    /* What the model says a rival of this quality settles at. */
    function rivalCeiling(state, quality, opts) {
      opts = opts || {};
      var c = { id: 'cmp_probe', name: 'Probe', studio: 'Lab',
                angle: opts.angle || 'themepark', quality: quality,
                budget: opts.budget === undefined ? 1 : opts.budget,
                players: opts.players === undefined ? 1000 : opts.players,
                peak: 0, momentum: 0, status: 'live', launchWeek: -40,
                announcedWeek: null,
                weeksSinceContent: opts.stale || 0, contentCadence: 28, age: 40 };
      state.competitors = [c];
      PN.competitors.tick(state, { rng: new U.Rng(1), world: { design: state.design }, fit: {} });
      return c.target || 0;
    }

    check('a rival of eighty-plus is a real presence in the market', (function () {
      var s = rivalWorld(77);
      var pool = PN.tax.marketPool(s.era);
      var big = rivalCeiling(s, 88);
      window.__rivalBig = 'an 88-rated rival settles at ' + U.fmtInt(big) + ' of a ' +
        U.fmtCompact(pool) + ' market (' + U.fmtPct(big / pool * 100, 1) + ')';
      return big > pool * 0.08;
    })(), function () { return window.__rivalBig; }());

    check('and quality is what decides how big they get', (function () {
      var s = rivalWorld(78);
      var sizes = [40, 55, 70, 85].map(function (q) { return rivalCeiling(s, q); });
      window.__rivalScale = [40, 55, 70, 85].map(function (q, i) {
        return q + ' → ' + U.fmtInt(sizes[i]); }).join(', ');
      /* Monotonic, and the gap between a good game and a poor one is
         not a rounding error. */
      return sizes[1] > sizes[0] && sizes[2] > sizes[1] && sizes[3] > sizes[2] &&
             sizes[3] > sizes[0] * 8;
    })(), function () { return window.__rivalScale; }());

    check('a content drought costs a rival what it costs you', (function () {
      var s = rivalWorld(79);

      /* Just under their cadence - past it they ship, which is the
         point of a cadence. */
      var dry = rivalCeiling(s, 80, { stale: 27 });
      window.__rivalDry = 'fresh ' + U.fmtInt(fresh) + ', twenty-seven weeks without a patch ' +
        U.fmtInt(dry);
      return dry < fresh * 0.8;
    })(), function () { return window.__rivalDry; }());

      weak.runtime.reviewScore = 40; weak.runtime.sentiment = 38;
      strong.runtime.reviewScore = 92; strong.runtime.sentiment = 88;

    })(), function () { return window.__rivalPush; }());

    check('a good rival survives a long campaign instead of decaying to nothing',
      (function () {
        var s = rivalWorld(81);

    check('but a game nobody rates does eventually shut down', (function () {

    check('a rival launching is a couple of months of pressure, not a rapture',
      (function () {

        var s = rivalWorld(83);

        PN.competitors.launchShock(s, comp, { rng: rng, world: { design: s.design } });

          'raiders by ' + U.fmtPct(pull * 85, 0) + ', fading to ' +
